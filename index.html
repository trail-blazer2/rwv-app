        /* Sleek custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0B1011; }
        ::-webkit-scrollbar-thumb { background: #232E30; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #3a4a4d; }

        .bg-rwv-panel {
            background-color: rgb(28 29 34)!important;
        }
        .bg-rwv-bg {
            background-color: rgb(19 19 24) !important;
        }
        .dnesnistav {
            color: rgb(128 149 76) !important;
        }
        
        /* Range Slider Styling */
        input[type=range] { -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px; width: 14px;
            border-radius: 50%;
            background: #758749;
            cursor: pointer; margin-top: -5px;
            box-shadow: 0 0 10px rgba(117, 135, 73, 0.4);
            transition: transform 0.1s ease;
        }
        input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px;
            cursor: pointer; background: #232E30; border-radius: 2px;
        }

        /* SVG Diagram Animations */
        .svg-node { transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .node-active {
            fill: #151E20 !important;
            stroke: #C6F34F !important;
        }
        .node-text-active { fill: #C6F34F !important; }
        
        .svg-path-base {
            stroke: #232E30;
            stroke-width: 1.5;
            fill: none;
        }

        @keyframes pathReveal {
            0% { stroke-dashoffset: 1; opacity: 1; }
            100% { stroke-dashoffset: 0; opacity: 1; }
        }
        .path-reveal {
            stroke-dasharray: 1;
            stroke-dashoffset: 1;
            animation: pathReveal 0.6s ease-out forwards;
        }

        @keyframes pathFlow {
            0% { stroke-dashoffset: 0; opacity: 0; }
            20% { opacity: 1; }
            100% { stroke-dashoffset: -1; opacity: 1; }
        }
        .path-flow {
            stroke-dasharray: 0.035 0.05;
            opacity: 0;
            animation: pathFlow 1.8s linear infinite;
            animation-delay: 0.6s;
            animation-fill-mode: forwards;
        }

        @keyframes spinRing {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .spin-ring {
            transform-box: fill-box;
            transform-origin: center;
            animation: spinRing 3s linear infinite;
        }

        /* Ambient Glow Override */
        /* .blur-\[150px\] {background-color: rgb(221, 226, 206) !important;} */
        .blur-\[150px\] {
            background-color: rgb(206 226 220) !important;
        }

        /* Premium 3D Panel Border */
        /* .premium-panel { */
        /*    background: linear-gradient(#151E20, #151E20) padding-box, linear-gradient(45deg, #4C6368 0%, #232E30 25%, #232E30 75%, #4C6368 100%) border-box !important; */
        /*    border: 1px solid transparent !important; 
        /*    border-radius: 1rem !important; } */
        
        .premium-panel {
            background: linear-gradient(#1c1f22, #1a1b20) padding-box, linear-gradient(45deg, #4c5068 0%, #232E30 25%, #232730 75%, #4c5a68 100%) border-box !important;
            border: 1px solid transparent !important;
            border-radius: 1rem !important;
        }

        /* Liquid Glass Auth Box */
        .liquid-glass-panel {
            background: linear-gradient(135deg, rgba(21, 30, 32, 0.75) 0%, rgba(11, 16, 17, 0.85) 100%) padding-box,
                        linear-gradient(45deg, #4C6368 0%, #232E30 25%, #232E30 75%, #4C6368 100%) border-box !important;
            border: 1px solid transparent !important;
            border-radius: 1rem !important;
            backdrop-filter: blur(12px); /* Lowered blur radius for smooth 60fps performance */
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
        }

        /* 3D Curved Gradient Button (Dark Olive to Olive) */
        .tracking-wider {
            letter-spacing: 0.08em;
        }
        .font-bold {
            font-weight: 500;
        }

        .trajektorie {
            font-weight: 200!important;
            font-size: 0.9rem!important;
        }
        
        .text-xs {
            font-size: 0.78rem;
            line-height: 1rem;
        }
        
        .btn-3d-curve {
            background-color: #4f603e;
            background-image: radial-gradient(ellipse 50% 80% at 50% 140%, #76bc48 0%, transparent 160%);
            color: white;
            transition: all 0.3s ease;
        }

        .btn-3d-curve:hover {
            filter: brightness(1.15);
            transform: translateY(-1px);
            box-shadow: inset 0 -3px 10px rgba(0,0,0,0.4), inset 0 1px 3px rgba(255,255,255,0.2), 0 6px 20px rgba(0, 0, 0, 0.6);
        }

        /* Floating Graph Lines Animations */
        @keyframes float-line {
            0% { transform: translateX(-5%) translateY(0px) scale(1); }
            50% { transform: translateX(5%) translateY(-30px) scale(1.02); }
            100% { transform: translateX(-5%) translateY(0px) scale(1); }
        }
        .floating-line-1 { animation: float-line 14s ease-in-out infinite; }
        .floating-line-2 { animation: float-line 20s ease-in-out infinite reverse; animation-delay: -5s; }
        .floating-line-3 { animation: float-line 17s ease-in-out infinite; animation-delay: -2s; }

        /* Phase 2 Calibration Matrix & Shield Animations */
        @keyframes matrixGlow {
            0% { box-shadow: 0 0 5px rgba(198,243,79,0.1); }
            100% { box-shadow: 0 0 20px rgba(198,243,79,0.3); }
        }
        .animate-matrix-glow {
            animation: matrixGlow 2s infinite alternate;
        }
        .svg-path-morph { 
            transition: d 1s cubic-bezier(0.25, 1, 0.5, 1), stroke 1s ease, filter 1s ease; 
        }
        .matrix-text { 
            font-family: 'Courier New', Courier, monospace; 
        }

        /* ===== MOBILE-ONLY OVERRIDES (never affect >=768px / desktop) ===== */
        @media (max-width: 767px) {
            body {
                overflow-y: auto !important;
                overflow-x: hidden !important;
            }
            /* Allow the whole app shell to scroll vertically on small screens
               instead of being clipped by overflow-hidden containers designed
               for a fixed-height desktop layout. */
            .rwv-mobile-scroll-shell {
                height: auto !important;
                min-height: 100vh;
                overflow: visible !important;
            }
            .rwv-mobile-scroll-area {
                overflow: visible !important;
            }
            /* Slightly smaller thumb on touch to keep sliders easy to grab */
            input[type=range]::-webkit-slider-thumb {

            }

                width: 220% !important;
                height: 75% !important;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
            }
        }

        function DrawdownChart({ series, progress, label }) {
            if (!series) return null;
            const W = 800, H = 260, n = series.x1.length;
            const lo = Math.min(...series.x1, ...series.vt) - 2;
            const px = (i) => (i / (n - 1)) * W;
            const py = (v) => ((0 - v) / (0 - lo)) * H;
            const path = (arr, upTo) => arr.slice(0, upTo).map((v, i) => `${i ? 'L' : 'M'} ${px(i).toFixed(1)} ${py(v).toFixed(1)}`).join(' ');
            const k = Math.max(2, Math.floor(n * progress / 100));
            const ddX = Math.min(...series.x1), ddV = Math.min(...series.vt.slice(0, k));
            const ticks = [0, lo / 4, lo / 2, (3 * lo) / 4];
            return (
                <div>
                    <div className="flex flex-wrap justify-between text-[11px] text-gray-500 mb-2 gap-2">
                        <span>{label} · týdenní data, propad od maxima (%)</span>
                        <span><span className="text-red-400">■</span> Vždy 1× (max {ddX.toFixed(1)} %) &nbsp; <span className="text-rwv-lime">■</span> Dimenzování dle volatility (max {ddV.toFixed(1)} %)</span>
                    </div>
                    <div className="relative bg-rwv-bg/50 border border-rwv-border rounded-lg overflow-hidden">
                        <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-56 md:h-64" preserveAspectRatio="none">
                            {ticks.map((t, i) => <line key={i} x1="0" x2={W} y1={py(t)} y2={py(t)} stroke="#232E30" strokeWidth="1" />)}
                            <path d={path(series.x1, n)} fill="none" stroke="#ef4444" strokeWidth="1.5" opacity="0.7" vectorEffect="non-scaling-stroke" />
                            <path d={path(series.vt, k)} fill="none" stroke="#C6F34F" strokeWidth="2" vectorEffect="non-scaling-stroke" />
                        </svg>
                        <div className="absolute left-1 top-0 h-full flex flex-col justify-between text-[9px] text-gray-500 py-1 pointer-events-none">
                            {ticks.map((t, i) => <span key={i}>{t.toFixed(0)} %</span>)}
                        </div>
                    </div>
                    <div className="flex justify-between text-[10px] text-gray-600 mt-1">
                        <span>{DD_DATA._range[0]}</span><span>{DD_DATA._range[1]}</span>
                    </div>
                </div>
            );
        }
        
        const PARAM_COLORS = ['#C6F34F','#4FD1C6','#D9A441','#9B8FD9','#E0954F','#4FB8D9','#B39DDB','#D9C44F','#ef4444','#60a5fa','#34d399','#f472b6','#fbbf24','#a3e635','#22d3ee','#fb7185','#c084fc','#f97316','#2dd4bf','#e879f9','#facc15','#38bdf8','#86efac'];
        function ParamLines({ params, history }) {
            const W = 800, H = 200;
            const bounds = (s) => { const m = s.match(/(-?[\d.]+)\s+-\s+(-?[\d.]+)/); return m ? [parseFloat(m[1]), parseFloat(m[2])] : [0, 1]; };
            if (history.length < 2) return <div className="h-48 flex items-center justify-center text-xs text-gray-600">Spusťte optimalizátor pro zobrazení průběhu vah.</div>;
            return (
                <div>
                    <div className="text-[11px] text-gray-500 mb-2">Poloha každé váhy v povoleném rozsahu (0 % = dolní mez, 100 % = horní mez)</div>
                    <div className="relative bg-rwv-bg/50 border border-rwv-border rounded-lg overflow-hidden">
                        <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-48 md:h-56" preserveAspectRatio="none">
                            {[0, 25, 50, 75, 100].map(g => <line key={g} x1="0" x2={W} y1={H - g * H / 100} y2={H - g * H / 100} stroke="#232E30" strokeWidth="1" />)}
                            {params.map((p, j) => {
                                const [a, b] = bounds(p.limit);
                                const d = history.map((row, i) => {
                                    const pos = Math.min(1, Math.max(0, (parseFloat(row[j]) - a) / (b - a)));
                                    return `${i ? 'L' : 'M'} ${(i / 50 * W).toFixed(1)} ${(H - pos * H).toFixed(1)}`;
                                }).join(' ');
                                return <path key={j} d={d} fill="none" stroke={PARAM_COLORS[j % PARAM_COLORS.length]} strokeWidth="1.5" opacity="0.85" vectorEffect="non-scaling-stroke" />;
                            })}
                        </svg>
                        <div className="absolute left-1 top-0 h-full flex flex-col justify-between text-[9px] text-gray-500 py-1 pointer-events-none">
                            <span>100 %</span><span>75 %</span><span>50 %</span><span>25 %</span><span>0 %</span>
                        </div>
                    </div>
                    <div className="flex flex-wrap gap-x-3 gap-y-1 mt-2">
                        {params.map((p, j) => <span key={j} className="text-[9px] text-gray-500"><span style={{ color: PARAM_COLORS[j % PARAM_COLORS.length] }}>■</span> {p.name.split(' ')[0]}</span>)}
                    </div>
                </div>
            );
        }

        const INITIAL_DUMMY_CURVE = Array.from({length: 28}, (_, i) => ({
            day: i * 5,
            price: +(80 + Math.sin(i / 4) * 2 + (i * 0.2)).toFixed(2)
        }));

        // --- PURE CANVAS CHART PLUGINS ---
        
        const verticalUnderfillPlugin = {
            id: 'verticalUnderfill',
            beforeDatasetDraw: (chart, args) => {
                const ctx = chart.ctx;
                const meta = args.meta;
                if (!meta || !meta.data.length || !chart.chartArea) return;
                
                const topY = chart.chartArea.top;
                const bottomY = chart.chartArea.bottom;
                
                ctx.save();
                
                ctx.beginPath();
                ctx.moveTo(meta.data[0].x, bottomY);
                meta.data.forEach(p => ctx.lineTo(p.x, p.y));
                ctx.lineTo(meta.data[meta.data.length - 1].x, bottomY);
                ctx.closePath();
                ctx.clip();
                
                ctx.beginPath();
                for (let i = 0; i < meta.data.length; i++) {
                    const px = meta.data[i].x;
                    ctx.moveTo(px, topY);
                    ctx.lineTo(px, bottomY);
                    if (i < meta.data.length - 1) {
                        const midX = (px + meta.data[i+1].x) / 2;
                        ctx.moveTo(midX, topY);
                        ctx.lineTo(midX, bottomY);
                    }
                }
                ctx.strokeStyle = 'rgba(198, 243, 79, 0.08)'; 
                ctx.lineWidth = 1;
                ctx.stroke();
                
                ctx.restore();
            }
        };

        const advancedHoverPlugin = {
            id: 'advancedHover',
            beforeDatasetDraw: (chart, args) => {
                const ctx = chart.ctx;
                const meta = args.meta;
                if (!chart.chartArea) return;

                const topY = chart.chartArea.top;
                const bottomY = chart.chartArea.bottom;
                
                if (bottomY <= topY) return; 

                const isHovered = chart.tooltip?._active?.length > 0;
                
                if (chart._rwv_hover_opacity === undefined) chart._rwv_hover_opacity = 0;
                
                const targetOpacity = isHovered ? 1 : 0;
                const opacityDiff = targetOpacity - chart._rwv_hover_opacity;
                
                if (Math.abs(opacityDiff) > 0.01) {
                    chart._rwv_hover_opacity += opacityDiff * 0.1;
                    requestAnimationFrame(() => chart.render());
                } else {
                    chart._rwv_hover_opacity = targetOpacity;
                }

                const o = chart._rwv_hover_opacity; 

                const blend = (c1, c2, factor) => [
                    Math.round(c1[0] + (c2[0] - c1[0]) * factor),
                    Math.round(c1[1] + (c2[1] - c1[1]) * factor),
                    Math.round(c1[2] + (c2[2] - c1[2]) * factor),
                    c1[3] + (c2[3] - c1[3]) * factor 
                ];
                
                const currentFill = blend([198, 243, 79, 0.15], [58, 71, 34, 0.4], o);
                const currentBorder = blend([198, 243, 79], [58, 71, 34], o);

                const grad = ctx.createLinearGradient(0, topY, 0, bottomY);
                grad.addColorStop(0, `rgba(${currentFill[0]}, ${currentFill[1]}, ${currentFill[2]}, ${currentFill[3].toFixed(3)})`);
                grad.addColorStop(1, `rgba(${currentFill[0]}, ${currentFill[1]}, ${currentFill[2]}, 0)`);
                
                const borderColorStr = `rgb(${currentBorder[0]}, ${currentBorder[1]}, ${currentBorder[2]})`;
                
                meta.dataset.options.borderColor = borderColorStr;
                meta.dataset.options.backgroundColor = grad;
                
                chart.data.datasets[0].borderColor = borderColorStr;
                chart.data.datasets[0].backgroundColor = grad;
            },
            afterDatasetsDraw: (chart) => {
                const isHovered = chart.tooltip?._active?.length > 0;
                const container = chart.canvas.closest('.h-\\[500px\\]') || chart.canvas.closest('.h-\\[320px\\]') || chart.canvas.parentElement.parentElement;
                
                let glowLayer = null;
                if (container) {
                    glowLayer = container.querySelector('.rwv-hover-glow');
                    if (!glowLayer) {
                        glowLayer = document.createElement('div');
                        glowLayer.className = 'rwv-hover-glow absolute inset-0 pointer-events-none z-[5] rounded-2xl';
                        container.appendChild(glowLayer);
                    }
                }
                
                if (chart._rwv_hover_opacity <= 0.01 && !isHovered) {
                    chart._rwv_crosshair = null;
                    if (glowLayer) glowLayer.style.backgroundImage = ''; 
                    return;
                }
                
                const ctx = chart.ctx;
                if (!chart._rwv_crosshair) chart._rwv_crosshair = { x: null, y: null };
                
                if (isHovered) {
                    const activePoint = chart.tooltip._active[0];
                    const { x: tx, y: ty } = activePoint.element.tooltipPosition();
                    
                    if (chart._rwv_crosshair.x === null) {
                        chart._rwv_crosshair.x = tx;
                        chart._rwv_crosshair.y = ty;
                    } else {
                        chart._rwv_crosshair.x += (tx - chart._rwv_crosshair.x) * 0.15;
                        chart._rwv_crosshair.y += (ty - chart._rwv_crosshair.y) * 0.15;
                    }
                    
                    if (Math.abs(tx - chart._rwv_crosshair.x) > 0.1 || Math.abs(ty - chart._rwv_crosshair.y) > 0.1) {
                        requestAnimationFrame(() => chart.render());
                    }
                }
                
                const x = chart._rwv_crosshair.x;
                const y = chart._rwv_crosshair.y;
                const o = chart._rwv_hover_opacity; 
                
                if (x === null || y === null) return;

                if (glowLayer) {
                    const canvasRect = chart.canvas.getBoundingClientRect();
                    const containerRect = container.getBoundingClientRect();
                    const relX = x + (canvasRect.left - containerRect.left);
                    const relY = y + (canvasRect.top - containerRect.top);
                    
                    glowLayer.style.backgroundImage = `radial-gradient(circle at ${relX}px ${relY}px, rgba(198, 243, 79, ${0.12 * o}) 0%, transparent 280px)`;
                }

                const topY = chart.scales.y.top;
                const bottomY = chart.scales.y.bottom;
                const leftX = chart.scales.x.left;
                const rightX = chart.scales.x.right;

                ctx.save();

                const gradY = ctx.createLinearGradient(0, topY, 0, bottomY);
                gradY.addColorStop(0, 'rgba(198, 243, 79, 0)');
                gradY.addColorStop(Math.max(0, Math.min(1, (y - topY) / (bottomY - topY))), `rgba(198, 243, 79, ${0.6 * o})`);
                gradY.addColorStop(1, 'rgba(198, 243, 79, 0)');

                const gradX = ctx.createLinearGradient(leftX, 0, rightX, 0);
                gradX.addColorStop(0, 'rgba(198, 243, 79, 0)');
                gradX.addColorStop(Math.max(0, Math.min(1, (x - leftX) / (rightX - leftX))), `rgba(198, 243, 79, ${0.6 * o})`);
                gradX.addColorStop(1, 'rgba(198, 243, 79, 0)');

                ctx.beginPath(); ctx.moveTo(x, topY); ctx.lineTo(x, bottomY);
                ctx.strokeStyle = gradY; ctx.lineWidth = 1; ctx.stroke();

                ctx.beginPath(); ctx.moveTo(leftX, y); ctx.lineTo(rightX, y);
                ctx.strokeStyle = gradX; ctx.lineWidth = 1; ctx.stroke();

                const meta = chart.getDatasetMeta(0);
                const points = meta.data;
                
                if (points.length > 0) {
                    ctx.beginPath();
                    ctx.moveTo(points[0].x, points[0].y);
                    for (let i = 1; i < points.length; i++) {
                        ctx.bezierCurveTo(points[i-1].cp2x, points[i-1].cp2y, points[i].cp1x, points[i].cp1y, points[i].x, points[i].y);
                    }
                    
                    const lineGrad = ctx.createRadialGradient(x, y, 0, x, y, 200);
                    lineGrad.addColorStop(0, `rgba(198, 243, 79, ${1 * o})`);
                    lineGrad.addColorStop(1, 'rgba(198, 243, 79, 0)');
                    
                    ctx.strokeStyle = lineGrad;
                    ctx.lineWidth = meta.dataset.options.borderWidth || 2; 
                    ctx.stroke();
                }

                ctx.beginPath();
                ctx.arc(x, y, 6, 0, 2 * Math.PI);
                ctx.fillStyle = `rgba(11, 16, 17, ${o})`;
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = `rgba(198, 243, 79, ${o})`;
                ctx.shadowColor = `rgba(198, 243, 79, ${o})`;
                ctx.shadowBlur = 10;
                ctx.stroke();

                ctx.restore();
            }
        };
        const rangeBandPlugin = {
            id: 'rwvBand',
            beforeDatasetsDraw: (chart) => {
                const b = chart.canvas._rwv_band;
                if (!b || !chart.canvas._rwv_show || !chart.scales.x || !chart.scales.y) return;
                const xs = chart.scales.x, ys = chart.scales.y, ctx = chart.ctx;
                ctx.save();
                ctx.beginPath(); ctx.rect(chart.chartArea.left, chart.chartArea.top, chart.chartArea.right - chart.chartArea.left, chart.chartArea.bottom - chart.chartArea.top); ctx.clip();
                ctx.beginPath();
                b.high.forEach((v, i) => {
                    const x = xs.getPixelForValue(i), y = ys.getPixelForValue(v);
                    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                });
                for (let i = b.low.length - 1; i >= 0; i--) ctx.lineTo(xs.getPixelForValue(i), ys.getPixelForValue(b.low[i]));
                ctx.closePath();
                ctx.fillStyle = 'rgba(198, 243, 79, 0.07)'; ctx.fill();
                ctx.strokeStyle = 'rgba(198, 243, 79, 0.25)'; ctx.lineWidth = 1; ctx.stroke();
                ctx.restore();
            }
        };
        Chart.register(verticalUnderfillPlugin, advancedHoverPlugin, rangeBandPlugin);

        // --- DASHBOARD CHART COMPONENT ---
        function ProjectionChart({ data, commodityLabel, isSimulating }) {
            const canvasRef = useRef(null);
            const chartInstanceRef = useRef(null);
            const [showBand, setShowBand] = useState(false);

            useEffect(() => {
                if (!canvasRef.current || !data || data.length === 0) return;

                const labels = data.map(d => d.day === 0 ? "Dnes" : `+${d.day} dní`);
                const prices = data.map(d => d.price);
                const lows = data.map(d => d.low ?? d.price);
                const highs = data.map(d => d.high ?? d.price);
                const lo = showBand ? Math.min(...lows) : Math.min(...prices), hi = showBand ? Math.max(...highs) : Math.max(...prices);
                const pad = (hi - lo) * 0.04 || 1;
                canvasRef.current._rwv_band = { low: lows, high: highs };
                canvasRef.current._rwv_show = showBand;

                if (!chartInstanceRef.current) {
                    const ctx = canvasRef.current.getContext('2d');

                    chartInstanceRef.current = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels,
                            datasets: [{
                                label: `Predikce`,
                                data: prices,
                                borderColor: '#C6F34F',
                                backgroundColor: 'rgba(198, 243, 79, 0.15)',
                                borderWidth: 2,
                                tension: 0.4, 
                                pointRadius: 0, 
                                pointHoverRadius: 0, 
                                fill: true,
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            animation: { duration: 600, easing: 'easeOutQuart' },
                            hover: { animationDuration: 400 }, 
                            interaction: { intersect: false, mode: 'index' },
                            plugins: {
                                legend: { display: false },
                                tooltip: {
                                    enabled: true,
                                    backgroundColor: '#151E20', titleColor: '#6B8286',
                                    bodyColor: '#C6F34F', borderColor: '#232E30',
                                    borderWidth: 1, padding: 12, displayColors: false,
                                    titleFont: { size: 11, family: 'system-ui' },
                                    bodyFont: { size: 14, family: 'system-ui', weight: 'bold' },
                                    animation: { duration: 400, easing: 'easeOutQuart' }, 
                                    callbacks: {
                                        title: (ctx) => ctx[0].label,
                                        label: (ctx) => {
                                            const b = ctx.chart.canvas._rwv_band;
                                            const out = ['$' + ctx.parsed.y.toFixed(2)];
                                            if (b && ctx.dataIndex > 0) out.push('Pásmo 80 %: $' + b.low[ctx.dataIndex].toFixed(2) + ' – $' + b.high[ctx.dataIndex].toFixed(2));
                                            return out;
                                        }
                                    }
                                }
                            },
                            scales: {
                                x: { ticks: { color: '#6B8286', font: { size: 11, family: 'system-ui' } }, grid: { display: false } },
                                y: { min: lo - pad, max: hi + pad, ticks: { color: '#6B8286', font: { size: 11, family: 'system-ui' } }, grid: { display: false } }
                            }
                        }
                    });
                } else {
                    chartInstanceRef.current.options.scales.y.min = lo - pad;
                    chartInstanceRef.current.options.scales.y.max = hi + pad;
                    chartInstanceRef.current.data.labels = labels;
                    chartInstanceRef.current.data.datasets[0].data = prices;
                    chartInstanceRef.current.update(); 
                }
            }, [data, commodityLabel, showBand]);

            useEffect(() => {
                return () => { if (chartInstanceRef.current) chartInstanceRef.current.destroy(); }
            }, []);

            return (
                <div className="relative w-full h-[320px] md:h-[500px] premium-panel p-4 md:p-6 shadow-2xl flex-1 flex flex-col overflow-hidden">
                    
                    <div className="absolute top-[-140px] left-1/2 -translate-x-1/2 w-[400px] h-[200px] bg-rwv-lime rounded-full blur-[150px] opacity-10 pointer-events-none z-0"></div>

                    <div className="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-2 sm:gap-0 mb-4 z-20">
                        <h3 className="text-base md:text-lg font-bold text-white tracking-wide trajektorie">Cenová Trajektorie · střední scénář a pásmo 80 %</h3>
                        
                        <button onClick={() => setShowBand(!showBand)} className="text-[10px] md:text-xs font-bold uppercase tracking-wider border border-rwv-border rounded px-3 py-1 text-rwv-textMuted hover:text-white transition">
                            {showBand ? 'Skrýt pásmo 80 %' : 'Zobrazit pásmo 80 %'}
                        </button>
                        <div className="h-6 flex items-center">
                            {isSimulating || data === INITIAL_DUMMY_CURVE || data.length === 0 ? (
                                <span className="text-rwv-lime text-[10px] md:text-xs font-bold animate-pulse tracking-widest bg-rwv-lime/10 px-3 py-1 rounded-md shadow-[0_0_10px_rgba(198,243,79,0.2)]">
                                    PŘEPOČÍTÁVÁM SDE
                                </span>
                            ) : (
                                <span className="text-[10px] md:text-xs text-rwv-textMuted flex items-center gap-2">
                                    <div className="w-2 h-2 rounded-full bg-rwv-lime"></div>
                                    Synchronizováno
                                </span>
                            )}
                        </div>
                    </div>
                    
                    <div className="relative flex-1 w-full z-20">
                        <canvas ref={canvasRef}></canvas>
                    </div>
                </div>
            );
        }

        // --- MATH ENGINE SVG SIMULATION DIAGRAM ---
        const IMPORTANCE_HEIGHT = { 1: 40, 2: 56, 3: 74 };
        const DIAGRAM_HEIGHT = 500;
        const NODE_GAP = 14;

        // Restrained, same-family palette (no rainbow) — each category gets one
        // consistent muted accent, all readable against the dark theme.
        const CATEGORY_COLORS = {
            data: '#4FD1C6',        // teal — external data feeds
            decompose: '#D9A441',   // amber — sub-component math
            core: '#C6F34F',        // lime — the 3 headline indices + MADR
            regime: '#9B8FD9',      // muted violet — decision/branching logic
            equilibrium: '#D9C44F', // warm gold — targets & carry cost
            sde: '#E0954F',         // orange — iterative Monte Carlo loops
            kalman: '#4FB8D9',      // cyan — iterative filtering/correction
            weight: '#B39DDB',      // soft violet — horizon weighting/blending
            final: '#C6F34F'        // lime — final output
        };

        const COLUMN_DEFS = [
            { x: 10, items: [
                { key: 'wb', label: 'Světová Banka', phase: 1, importance: 1, category: 'data' },
                { key: 'fred', label: 'FRED Makro', phase: 1, importance: 1, category: 'data' },

            ]},
            { x: 850, items: [

                { key: 'dx_mkt', label: 'SDE dx(t) ×27', phase: 6, importance: 2, category: 'sde', shape: 'circle' },
            ]},
            { x: 1010, items: [
                { key: 'kalman', label: 'Kalman Filtr P(str)', phase: 7, importance: 2, category: 'kalman', shape: 'circle' },
                { key: 'f_anchors', label: 'Kotvy E⁻ / E⁺', phase: 7, importance: 2, category: 'kalman' },

        ];

        function buildNodes() {
            const built = {};
            COLUMN_DEFS.forEach(col => {
                const heights = col.items.map(it => IMPORTANCE_HEIGHT[it.importance] || 40);
                const extraGaps = col.items.map(it => it.detached ? 22 : 0);
                const totalHeight = heights.reduce((a, b) => a + b, 0)
                    + NODE_GAP * (col.items.length - 1)
                    + extraGaps.reduce((a, b) => a + b, 0);
                let y = (DIAGRAM_HEIGHT - totalHeight) / 2;
                col.items.forEach((it, idx) => {
                    if (extraGaps[idx]) y += extraGaps[idx];
                    const h = heights[idx];
                    built[it.key] = {
                        x: col.x, y, label: it.label, phase: it.phase, height: h,
                        importance: it.importance, category: it.category,
                        shape: it.shape || 'rect', detached: !!it.detached
                    };
                    y += h + NODE_GAP;
                });
            });
            return built;
        }

            const [error, setError] = useState(null);

            const handleLogout = () => {
                localStorage.removeItem('rwv_token');
                setToken(null);
            };

            const getAuthHeaders = () => ({
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            });

            const handleApiError = (res) => {
                if (res.status === 401) {
                    handleLogout();
                    throw new Error("Relace vypršela. Přihlaste se znovu.");
                }
                return res.json();
            };

            // 1. FAST LOADING BAR (Syncs with API)
            useEffect(() => {
                if (!token) return;
                const interval = setInterval(() => {
                    setLoadProgress(p => {
                        if (p < 90) return p + 15; // Very fast to 90%
                        if (apiLoaded) return 100; // Snap to 100% when API completes
                        return 90; // Hang safely at 90% if API is still loading
                    });
                }, 20); 
                return () => clearInterval(interval);
            }, [token, apiLoaded]);

            // Reveal app and trigger micro-flash
            useEffect(() => {
                if (loadProgress >= 100) {
                    const t = setTimeout(() => {
                        setAppReady(true);
                        // Keep the "PŘEPOČÍTÁVÁM SDE" text for exactly 150ms after UI appears
                        setTimeout(() => setIsSimulating(false), 150); 
                    }, 50);
                    return () => clearTimeout(t);
                }
            }, [loadProgress]);

            // 2. BACKGROUND DATA FETCHING
            useEffect(() => {
                if (!token) return;
                Promise.all([
                    fetch(`${API_BASE}/api/v1/predict`, { headers: getAuthHeaders() }).then(handleApiError),
                    fetch(`${API_BASE}/api/v1/data-status`, { headers: getAuthHeaders() }).then(handleApiError)
                ])
                .then(([predictRes, healthRes]) => {
                    if (predictRes.status === "success" && predictRes.data) {
                        setDefaultPredictions(predictRes.data);
                        setHealthData(healthRes.indices);
                        setSliders({ A_it: 0.5, D_it: 0.5, R_it: 0.5 });
                        setApiLoaded(true); // Tells loading bar to finish
                    } else {
                        setError("Cache jádra čeká. Spusťte výpočty.");
                    }
                })
                .catch(err => {
                    if(err.message !== "Relace vypršela. Přihlaste se znovu.") {
                        setError("Chyba připojení k RWV API.");
                    }
                    setApiLoaded(true); // End loading screen even on error
                });
            }, [token]);

            // 3. COMMODITY SWITCH
            useEffect(() => {
                if (defaultPredictions && defaultPredictions[selectedCommodityId]) {
                    setIsSimulating(true); // Micro-flash on switch
                    setSliders({ A_it: 0.5, D_it: 0.5, R_it: 0.5 });
                    setTimeout(() => setIsSimulating(false), 150);
                }
            }, [selectedCommodityId, defaultPredictions]);

            // 4. INSTANT CUSTOM SLIDER SIMULATION VIA TRILINEAR LOOKUP TENSOR
            useEffect(() => {
                if (!defaultPredictions || !token) return;
                const data = defaultPredictions[selectedCommodityId];
                if (!data) return;

                if (data.tensor) {
                    const { A_it, D_it, R_it } = sliders;
                    const fmt = (v) => v.toFixed(2);
                    
                    const getIdx = (v) => Math.min(Math.floor(v / 0.2), 4);
                    const aI = getIdx(A_it), dI = getIdx(D_it), rI = getIdx(R_it);
                    
                    const A0 = aI * 0.2, A1 = A0 + 0.2;
                    const D0 = dI * 0.2, D1 = D0 + 0.2;
                    const R0 = rI * 0.2, R1 = R0 + 0.2;
                    
                    const wa = (A_it - A0) / 0.2;
                    const wd = (D_it - D0) / 0.2;
                    const wr = (R_it - R0) / 0.2;

                    const corners = [
                        { key: `${fmt(A0)}_${fmt(D0)}_${fmt(R0)}`, w: (1 - wa) * (1 - wd) * (1 - wr) },
                        { key: `${fmt(A1)}_${fmt(D0)}_${fmt(R0)}`, w: wa * (1 - wd) * (1 - wr) },
                        { key: `${fmt(A0)}_${fmt(D1)}_${fmt(R0)}`, w: (1 - wa) * wd * (1 - wr) },
                        { key: `${fmt(A1)}_${fmt(D1)}_${fmt(R0)}`, w: wa * wd * (1 - wr) },
                        { key: `${fmt(A0)}_${fmt(D0)}_${fmt(R1)}`, w: (1 - wa) * (1 - wd) * wr },
                        { key: `${fmt(A1)}_${fmt(D0)}_${fmt(R1)}`, w: wa * (1 - wd) * wr },
                        { key: `${fmt(A0)}_${fmt(D1)}_${fmt(R1)}`, w: (1 - wa) * wd * wr },
                        { key: `${fmt(A1)}_${fmt(D1)}_${fmt(R1)}`, w: wa * wd * wr }
                    ];

                    let blendedCurve = new Array(28).fill(0);
                    let validCorners = 0;

                    corners.forEach(c => {
                        const cornerCurve = data.tensor[c.key];
                        if (cornerCurve) {
                            validCorners++;
                            for (let i = 0; i < 28; i++) {
                                blendedCurve[i] += cornerCurve[i] * c.w;
                            }
                        }
                    });

                    if (validCorners === 8) {
                        const defaultCurve = data.projection_curve;
                        
                        const instantCurve = blendedCurve.map((price, i) => {
                            const defPt = defaultCurve[i] || { price: 1, low: 1, high: 1 };
                            const ratioLow = defPt.price > 0 ? (defPt.low / defPt.price) : 1;
                            const ratioHigh = defPt.price > 0 ? (defPt.high / defPt.price) : 1;
                            
                            return { 
                                day: i === 0 ? 0 : i * 5, 
                                price: price,
                                low: price * ratioLow,
                                high: price * ratioHigh
                            };
                        });
                        setChartData(instantCurve);
                    }
                } else {
                    // Graceful fallback to API if tensor isn't generated yet
                    const timer = setTimeout(() => {
                        setIsSimulating(true);
                        fetch(`${API_BASE}/api/v1/simulate-custom`, {
                            method: 'POST',
                            headers: getAuthHeaders(),
                            body: JSON.stringify({
                                commodity: selectedCommodityId,
                                A_it: parseFloat(sliders.A_it),
                                D_it: parseFloat(sliders.D_it),
                                R_it: parseFloat(sliders.R_it)
                            })
                        })
                        .then(handleApiError)
                        .then(res => {
                            if(res.status === "success") { setChartData(res.projection_curve); }
                            setIsSimulating(false);
                        })
                        .catch(err => { console.error("Sim error", err); setIsSimulating(false); });
                    }, 400);
                    return () => clearTimeout(timer);
                }

                    tone: "white",
                    items: [
                        { h: "Obchodujte pásmo, ne bod", p: "Příklad (Zlato $4 170): 30denní pásmo cca $3 880–$4 480. Cena pod spodní hranou = extrémní odchylka; statisticky se vrací. Pravidlo: neprodávat do pádu pod pásmo, nekupovat růst nad pásmo." },
                        { h: "Malá velikost = přežití", p: "S účtem do ~$10 000 je hlavní riziko vymazání, ne špatný tip. Velikost pozice = (risk na obchod) / (šířka pásma). Pásmo z terminálu je váš stop — držet se ho." },
                        { h: "Portfolio > jedna sázka", p: "Panel 'Portfolio riziko' počítá, kolik si pozice vzájemně kryjí (reálné korelace z roku dat). Dvě pozice, které se hýbou opačně, společně riskují méně než každá zvlášť." },
                        { h: "Když nevíte, neobchodujte", p: "Karta 'Pravděpodobnosti' řekne např. 'šance že Zlato bude za 30 dní nad $4 500 je 31 %'. Pod ~35 % se sázka nevyplácí — nejlepší obchod je žádný obchod." },
                    ],
                },
            ];
            const COLORS = { lime: "text-rwv-lime", amber: "text-yellow-400", white: "text-white" };
            return (
                <div className="flex-1 p-4 md:p-10 overflow-visible md:overflow-y-auto bg-rwv-bg font-sans">
                    <div className="max-w-4xl mx-auto">
                        <h2 className="text-xl md:text-3xl font-bold text-white mb-2 border-b border-rwv-border pb-4">
                            Hodnota Terminálu — ověřená čísla
                        </h2>
                        <p className="text-rwv-textMuted text-sm mt-4">
                            Tato stránka je součástí produktu. Všechna čísla pocházejí z dokumentovaných testů a jsou reprodukovatelná.
                        </p>
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-4 md:gap-6 mt-6 md:mt-8">
                            {BLOCKS.map((b) => (
                                <div key={b.t} className="bg-rwv-panel p-4 md:p-6 rounded-xl border border-rwv-border shadow-xl">
                                    <h4 className={`text-xs font-bold uppercase mb-4 tracking-widest border-b border-rwv-border pb-2 ${COLORS[b.tone]}`}>{b.t}</h4>
                                    <ul className="space-y-4">
                                        {b.items.map((it, i) => (
                                            <li key={i}>
                                                <div className="text-sm text-gray-200 font-semibold">{it.h}</div>
                                                <div className="text-xs text-gray-400 mt-1 leading-relaxed">{it.p}</div>
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        // --- PERSONAL RISK PANEL ---
        function PortfolioRiskTab({ token }) {
            const saved = (() => { try { return JSON.parse(localStorage.getItem('rwv_positions')); } catch (e) { return null; } })();
            const [rows, setRows] = useState(saved || [{ commodity: "Gold", amount: 10000, side: "long" }]);
            const [days, setDays] = useState(30);
            const [stop, setStop] = useState(0);
            const [budget, setBudget] = useState(0);
            const [res, setRes] = useState(null);
            const [err, setErr] = useState(null);
            const [busy, setBusy] = useState(false);
            const fmt = (x) => Math.round(x).toLocaleString('cs-CZ');
            const pct = (x) => (x * 100).toFixed(1) + ' %';
            const upd = (i, k, v) => setRows(rs => rs.map((r, j) => j === i ? { ...r, [k]: v } : r));
            const label = (id) => COMMODITIES.find(c => c.id === id)?.label || id;

            const run = async () => {
                setBusy(true); setErr(null);
                localStorage.setItem('rwv_positions', JSON.stringify(rows));
                try {
                    const r = await fetch(`${API_BASE}/api/v1/portfolio-risk`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify({
                            positions: rows.map(x => ({ commodity: x.commodity, amount_usd: parseFloat(x.amount) || 0, side: x.side })),
                            days, stop_usd: parseFloat(stop) || 0, budget_usd: parseFloat(budget) || 0
                        })
                    });
                    const d = await r.json();
                    if (d.status !== 'success') { setErr(d.message || 'Chyba výpočtu'); setRes(null); } else setRes(d);
                } catch (e) { setErr('Chyba připojení k API.'); }
                setBusy(false);
            };

            const input = "bg-rwv-bg border border-rwv-border rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-rwv-olive";
            return (
                <div className="flex-1 p-4 md:p-10 overflow-visible md:overflow-y-auto bg-rwv-bg font-sans">
                    <div className="max-w-4xl mx-auto">
                        <h2 className="text-xl md:text-3xl font-bold text-white mb-2 border-b border-rwv-border pb-4">Osobní rizikový panel</h2>
                        <div className="bg-rwv-panel border border-rwv-border rounded-xl p-4 md:p-5 mt-4 text-sm text-gray-300 leading-relaxed">
                            <p className="mb-2"><b className="text-white">K čemu to je.</b> Panel neříká, kam půjde cena. Říká, kolik můžeš na svých pozicích reálně ztratit a jak velké pozice jsou k tvému limitu.</p>
                            <ul className="list-disc ml-5 space-y-1 text-gray-400">
                                <li><b className="text-gray-200">Kolik můžu ztratit:</b> šance 10 %, že ztráta za zvolený horizont překročí uvedenou částku, a rozsah výsledků s pravděpodobností 80 %.</li>
                                <li><b className="text-gray-200">Kde je riziko:</b> podíl každé pozice na celkovém riziku s ohledem na korelace. Záporný podíl = pozice funguje jako pojistka.</li>
                                <li><b className="text-gray-200">Správná velikost:</b> kolikrát zvětšit či zmenšit celé portfolio, aby odpovídalo tvému limitu ztráty, a pravděpodobnost dosažení stopu.</li>
                            </ul>
                            <p className="mt-3 text-xs text-gray-500">Základ: pásma volatility, která v testu na neviděných datech zasáhla ≈ 80 %. Předpoklady: nulový drift; korelace z posledního roku (v krizi bývají vyšší, diversifikace je pak nadhodnocena); ověřeno je pouze pásmo 80 %, proto se neuvádí extrémní VaR. Protichůdné pozice ve stejné komoditě se saldují. Pozice se ukládají jen v tomto prohlížeči.</p>
                        </div>

                        <div className="bg-rwv-panel border border-rwv-border rounded-xl p-4 md:p-5 mt-6">
                            <h4 className="text-xs font-bold uppercase text-rwv-textMuted mb-3 tracking-widest">Pozice</h4>
                            {rows.map((r, i) => (
                                <div key={i} className="flex flex-wrap gap-2 mb-2 items-center">
                                    <select className={input} value={r.commodity} onChange={e => upd(i, 'commodity', e.target.value)}>
                                        {COMMODITIES.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
                                    </select>
                                    <select className={input} value={r.side} onChange={e => upd(i, 'side', e.target.value)}>
                                        <option value="long">Long</option><option value="short">Short</option>
                                    </select>
                                    <input className={input + " w-36"} type="number" min="0" value={r.amount} onChange={e => upd(i, 'amount', e.target.value)} />
                                    <span className="text-xs text-gray-500">USD</span>
                                    <button className="text-xs text-gray-500 hover:text-red-400 px-2" onClick={() => setRows(rs => rs.filter((_, j) => j !== i))}>odebrat</button>
                                </div>
                            ))}
                            <button className="text-xs font-bold uppercase tracking-wider border border-rwv-border rounded px-3 py-1.5 text-rwv-textMuted hover:text-white mt-1"
                                onClick={() => setRows(rs => [...rs, { commodity: "Copper", amount: 10000, side: "long" }])}>+ Přidat pozici</button>

                            <div className="flex flex-wrap gap-4 mt-5 items-end">
                                <label className="text-xs text-gray-400 flex flex-col gap-1">Horizont
                                    <select className={input} value={days} onChange={e => setDays(parseInt(e.target.value))}>
                                        <option value={30}>30 dní</option><option value={90}>90 dní</option>
                                    </select></label>
                                <label className="text-xs text-gray-400 flex flex-col gap-1">Stop (ztráta v USD, volitelné)
                                    <input className={input + " w-40"} type="number" min="0" value={stop} onChange={e => setStop(e.target.value)} /></label>
                                <label className="text-xs text-gray-400 flex flex-col gap-1">Max. ztráta, kterou přijmu (USD, volitelné)
                                    <input className={input + " w-48"} type="number" min="0" value={budget} onChange={e => setBudget(e.target.value)} /></label>
                                <button onClick={run} disabled={busy} className="btn-3d-curve font-bold px-6 py-2.5 rounded-lg uppercase tracking-wider text-xs">{busy ? 'Počítám...' : 'Spočítat riziko'}</button>
                            </div>
                        </div>

                        {err && <div className="mt-4 text-sm text-red-300 bg-red-900/30 border border-red-500/40 rounded px-3 py-2">{err}</div>}

                        {res && (
                            <div className="mt-6 space-y-4">
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                                    <div className="bg-rwv-panel border border-rwv-border rounded-xl p-4">
                                        <div className="text-[10px] uppercase tracking-wider text-rwv-textMuted font-bold mb-1">Šance 10 %, že ztratíš víc než</div>
                                        <div className="text-2xl font-semibold text-white">${fmt(res.loss_10pct_usd)}</div>
                                        <div className="text-xs text-gray-500 mt-1">za {res.days} dní, {pct(res.loss_10pct_usd / Math.max(res.gross_usd, 1))} hrubé expozice</div>
                                    </div>
                                    <div className="bg-rwv-panel border border-rwv-border rounded-xl p-4">
                                        <div className="text-[10px] uppercase tracking-wider text-rwv-textMuted font-bold mb-1">Rozsah výsledku (80 %)</div>
                                        <div className="text-2xl font-semibold text-white">−${fmt(-res.range80_usd[0])} … +${fmt(res.range80_usd[1])}</div>
                                        <div className="text-xs text-gray-500 mt-1">symetrický, bez předpokladu směru</div>
                                    </div>
                                    <div className="bg-rwv-panel border border-rwv-border rounded-xl p-4">
                                        <div className="text-[10px] uppercase tracking-wider text-rwv-textMuted font-bold mb-1">Diverzifikace</div>
                                        <div className="text-2xl font-semibold text-white">{res.diversification_pct.toFixed(0)} %</div>
                                        <div className="text-xs text-gray-500 mt-1">o kolik je riziko nižší než součet jednotlivých pozic</div>
                                    </div>
                                </div>

                                <div className="bg-rwv-panel border border-rwv-border rounded-xl p-4 md:p-5">
                                    <h4 className="text-xs font-bold uppercase text-rwv-textMuted mb-3 tracking-widest">Odkud riziko pochází</h4>
                                    <table className="w-full text-sm">
                                        <thead><tr className="text-xs text-gray-500 text-right"><th className="text-left py-1">Komodita</th><th>Expozice</th><th>Samostatně (10 %)</th><th>Podíl na riziku</th></tr></thead>
                                        <tbody>
                                            {res.positions.map(p => (
                                                <tr key={p.commodity} className="border-t border-rwv-border/50 text-right">
                                                    <td className="text-left py-1.5 text-gray-200">{label(p.commodity)}</td>
                                                    <td className="text-gray-300">{p.exposure_usd < 0 ? '−' : ''}${fmt(Math.abs(p.exposure_usd))}</td>
                                                    <td className="text-gray-300">${fmt(p.standalone_loss10_usd)}</td>
                                                    <td className={p.risk_share_pct < 0 ? 'text-green-400' : 'text-gray-200'}>{p.risk_share_pct.toFixed(0)} %{p.risk_share_pct < 0 ? ' (pojistka)' : ''}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                    <p className="text-xs text-gray-500 mt-3">Pozice, která tvoří většinu rizika, ale ne většinu kapitálu, je typicky ta, kterou stojí za to zmenšit.</p>
                                </div>

                                {(res.stop || res.budget) && (
                                    <div className="bg-rwv-panel border border-rwv-border rounded-xl p-4 md:p-5 text-sm text-gray-300 space-y-2">
                                        {res.stop && <p>Stop <b className="text-white">−${fmt(res.stop.stop_usd)}</b>: pravděpodobnost, že na konci horizontu budeš pod ním, je <b className="text-white">{pct(res.stop.p_end_below)}</b>; že se ho dotkneš kdykoli během horizontu, zhruba <b className="text-white">{pct(res.stop.p_touch_approx)}</b> (hrubý odhad).</p>}
                                        {res.budget && <p>Tvůj limit ztráty ${fmt(res.budget.budget_usd)}: portfolio je potřeba násobit <b className="text-white">{res.budget.scale.toFixed(2)}×</b> {res.budget.scale < 1 ? '(zmenšit)' : '(prostor pro zvětšení)'}, aby šance 10 % odpovídala tomuto limitu.</p>}
                                    </div>
                                )}
                                <p className="text-xs text-gray-600">Korelace z {res.corr_days} obchodních dní. Nejde o investiční doporučení.</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // --- SIDEBAR SLIDER COMPONENT ---
        function SidebarSlider({ title, value, onChange }) {
            return (
                <div className="flex flex-col">
                    <div className="flex justify-between items-center mb-2">
                        <label className="text-xs font-semibold text-gray-300">{title}</label>
                        <span className="font-sans font-semibold text-xs text-rwv-olive bg-rwv-olive/10 px-2 py-0.5 rounded border border-rwv-olive/30">
                            {value.toFixed(2)}
                        </span>
                    </div>
                    <input type="range" min="0.00" max="1.00" step="0.01" value={value} onChange={onChange} />
                    <div className="flex justify-between text-[10px] text-rwv-textMuted mt-1.5 font-sans font-medium">
                        <span>0.00</span>
                        <span>1.00</span>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
