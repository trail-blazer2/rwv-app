<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RWV Forecasting Terminal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        rwv: {
                            bg: '#0B1011',       
                            panel: '#151E20',    
                            border: '#232E30',   
                            lime: '#C6F34F',     /* Bright active accent */
                            olive: '#758749',    /* Sidebar gradient to */
                            darkolive: '#2c2d2a',/* Sidebar gradient from */
                            textMuted: '#6B8286' 
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        /* Sleek custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0B1011; }
        ::-webkit-scrollbar-thumb { background: #232E30; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #3a4a4d; }
        
        /* Range Slider Styling */
        input[type=range] { -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px; width: 14px;
            border-radius: 50%;
            background: #758749;
            cursor: pointer; margin-top: -5px;
            box-shadow: 0 0 10px rgba(117, 135, 73, 0.4);
            transition: transform 0.1s ease;
        }
        input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px;
            cursor: pointer; background: #232E30; border-radius: 2px;
        }

        /* SVG Diagram Animations */
        .svg-node { transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .node-active {
            fill: #151E20 !important;
            stroke: #C6F34F !important;
        }
        .node-text-active { fill: #C6F34F !important; }
        
        .svg-path {
            stroke: #232E30;
            stroke-width: 1.5;
            transition: stroke 0.3s ease;
        }

        /* Ambient Glow Override */
        .blur-\[150px\] {
            background-color: rgb(221, 226, 206) !important;
        }

        /* Premium 3D Panel Border */
        .premium-panel {
            background: linear-gradient(#151E20, #151E20) padding-box,
                        linear-gradient(45deg, #4C6368 0%, #232E30 25%, #232E30 75%, #4C6368 100%) border-box !important;
            border: 1px solid transparent !important;
            border-radius: 1rem !important; /* Matches rounded-2xl */
        }

        /* Liquid Glass Auth Box */
        .liquid-glass {
            background: linear-gradient(135deg, rgba(21, 30, 32, 0.3) 0%, rgba(11, 16, 17, 0.5) 100%);
            backdrop-filter: blur(24px) saturate(200%);
            -webkit-backdrop-filter: blur(24px) saturate(200%);
            border: 1px solid rgba(198, 243, 79, 0.1);
            border-top: 1px solid rgba(198, 243, 79, 0.25);
            border-left: 1px solid rgba(198, 243, 79, 0.25);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
        }

        /* 3D Curved Gradient Button */
        .btn-3d-curve {
            background-color: #C6F34F; /* Bright graph line green */
            /* The elliptical gradient creates the 3D curve rising from the bottom */
            background-image: radial-gradient(ellipse 120% 80% at 50% 110%, #758749 0%, transparent 100%);
            color: #0B1011;
            box-shadow: inset 0 -3px 10px rgba(0,0,0,0.25), inset 0 2px 4px rgba(255,255,255,0.7), 0 4px 15px rgba(198, 243, 79, 0.3);
            border: none;
            transition: all 0.3s ease;
        }
        .btn-3d-curve:hover {
            filter: brightness(1.05);
            transform: translateY(-1px);
            box-shadow: inset 0 -3px 10px rgba(0,0,0,0.25), inset 0 2px 4px rgba(255,255,255,0.7), 0 6px 20px rgba(198, 243, 79, 0.5);
        }

        /* Floating Graph Lines Animations */
        @keyframes float-line {
            0% { transform: translateX(-5%) translateY(0px) scale(1); }
            50% { transform: translateX(5%) translateY(-30px) scale(1.02); }
            100% { transform: translateX(-5%) translateY(0px) scale(1); }
        }
        .floating-line-1 { animation: float-line 14s ease-in-out infinite; }
        .floating-line-2 { animation: float-line 20s ease-in-out infinite reverse; animation-delay: -5s; }
        .floating-line-3 { animation: float-line 17s ease-in-out infinite; animation-delay: -2s; }
        
        @keyframes dashMove { to { stroke-dashoffset: -24; } }
        
        .path-active {
            stroke: #C6F34F !important;
            stroke-dasharray: 8 8;
            animation: dashMove 0.8s linear infinite;
        }
    </style>
</head>
<body class="bg-rwv-bg text-gray-200 min-h-screen font-sans selection:bg-rwv-lime selection:text-rwv-bg overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const API_BASE = "https://ivanmazurov--rwv-engine-production-fastapi-app.modal.run"; 
        
        const COMMODITIES = [
            { id: "Gold", label: "Zlato" }, { id: "Gas", label: "Plyn" },
            { id: "Brent", label: "Ropa Brent" }, { id: "Copper", label: "Měď" },
            { id: "Palladium", label: "Palladium" }, { id: "Platinum", label: "Platina" },
            { id: "Cocoa", label: "Kakao" }, { id: "Silver", label: "Stříbro" }
        ];

        const TRANSLATIONS = {
            economic_activity: "Ekonomická aktivita", deficit: "Deficitní indikátory", systemic_risk: "Systémové riziko",
            gdp_ppp: "HDP (Parita kupní síly)", gdp_growth: "Růst HDP", peoples_income: "Příjmy obyvatelstva",
            unemployment: "Míra nezaměstnanosti", inflation: "Míra inflace", population: "Populační růst",
            fdi: "Přímé zahr. investice", pmi: "Index nákupních manažerů", inventories: "Aktuální zásoby",
            production: "Objem produkce", max_production: "Maximální kapacita", consumption: "Úroveň spotřeby",
            regulations: "Regulace a sankce", logistics: "Zpoždění logistiky", weather: "Klimatické anomálie",
            spread: "Prostorové rozdíly (Spread)", government_debt: "Vládní dluhové zatížení", interest_rate: "Úrokové sazby",
            gini: "Giniho koeficient (Nerovnost)", poverty_rate: "Míra chudoby", defense_spend: "Výdaje na obranu",
            rnd_spend: "Výdaje na vědu a výzkum", edu_spend: "Výdaje na školství", health_spend: "Výdaje na zdravotnictví",
            net_migration: "Čistá migrace", dxy: "Dolarový index (DXY)"
        };

        const INITIAL_DUMMY_CURVE = Array.from({length: 27}, (_, i) => ({
            day: (i + 1) * 15,
            price: 80 + Math.sin(i / 4) * 2 + (i * 0.2)
        }));

        // --- PURE CANVAS CHART PLUGINS ---
        
        const verticalUnderfillPlugin = {
            id: 'verticalUnderfill',
            beforeDatasetDraw: (chart, args) => {
                const ctx = chart.ctx;
                const meta = args.meta;
                if (!meta || !meta.data.length || !chart.chartArea) return;
                
                const topY = chart.chartArea.top;
                const bottomY = chart.chartArea.bottom;
                
                ctx.save();
                
                ctx.beginPath();
                ctx.moveTo(meta.data[0].x, bottomY);
                meta.data.forEach(p => ctx.lineTo(p.x, p.y));
                ctx.lineTo(meta.data[meta.data.length - 1].x, bottomY);
                ctx.closePath();
                ctx.clip();
                
                ctx.beginPath();
                for (let i = 0; i < meta.data.length; i++) {
                    const px = meta.data[i].x;
                    ctx.moveTo(px, topY);
                    ctx.lineTo(px, bottomY);
                    if (i < meta.data.length - 1) {
                        const midX = (px + meta.data[i+1].x) / 2;
                        ctx.moveTo(midX, topY);
                        ctx.lineTo(midX, bottomY);
                    }
                }
                ctx.strokeStyle = 'rgba(198, 243, 79, 0.08)'; 
                ctx.lineWidth = 1;
                ctx.stroke();
                
                ctx.restore();
            }
        };

        const advancedHoverPlugin = {
            id: 'advancedHover',
            beforeDatasetDraw: (chart, args) => {
                const ctx = chart.ctx;
                const meta = args.meta;
                if (!chart.chartArea) return;

                const topY = chart.chartArea.top;
                const bottomY = chart.chartArea.bottom;
                
                if (bottomY <= topY) return; 

                const isHovered = chart.tooltip?._active?.length > 0;
                
                if (chart._rwv_hover_opacity === undefined) chart._rwv_hover_opacity = 0;
                
                const targetOpacity = isHovered ? 1 : 0;
                const opacityDiff = targetOpacity - chart._rwv_hover_opacity;
                
                if (Math.abs(opacityDiff) > 0.01) {
                    chart._rwv_hover_opacity += opacityDiff * 0.1;
                    requestAnimationFrame(() => chart.render());
                } else {
                    chart._rwv_hover_opacity = targetOpacity;
                }

                const o = chart._rwv_hover_opacity; 

                const blend = (c1, c2, factor) => [
                    Math.round(c1[0] + (c2[0] - c1[0]) * factor),
                    Math.round(c1[1] + (c2[1] - c1[1]) * factor),
                    Math.round(c1[2] + (c2[2] - c1[2]) * factor),
                    c1[3] + (c2[3] - c1[3]) * factor 
                ];
                
                const currentFill = blend([198, 243, 79, 0.15], [58, 71, 34, 0.4], o);
                const currentBorder = blend([198, 243, 79], [58, 71, 34], o);

                const grad = ctx.createLinearGradient(0, topY, 0, bottomY);
                grad.addColorStop(0, `rgba(${currentFill[0]}, ${currentFill[1]}, ${currentFill[2]}, ${currentFill[3].toFixed(3)})`);
                grad.addColorStop(1, `rgba(${currentFill[0]}, ${currentFill[1]}, ${currentFill[2]}, 0)`);
                
                const borderColorStr = `rgb(${currentBorder[0]}, ${currentBorder[1]}, ${currentBorder[2]})`;
                
                meta.dataset.options.borderColor = borderColorStr;
                meta.dataset.options.backgroundColor = grad;
                
                chart.data.datasets[0].borderColor = borderColorStr;
                chart.data.datasets[0].backgroundColor = grad;
            },
            afterDatasetsDraw: (chart) => {
                const isHovered = chart.tooltip?._active?.length > 0;
                const container = chart.canvas.closest('.h-\\[500px\\]') || chart.canvas.parentElement.parentElement;
                
                let glowLayer = null;
                if (container) {
                    glowLayer = container.querySelector('.rwv-hover-glow');
                    if (!glowLayer) {
                        glowLayer = document.createElement('div');
                        glowLayer.className = 'rwv-hover-glow absolute inset-0 pointer-events-none z-[5] rounded-2xl';
                        container.appendChild(glowLayer);
                    }
                }
                
                if (chart._rwv_hover_opacity <= 0.01 && !isHovered) {
                    chart._rwv_crosshair = null;
                    if (glowLayer) glowLayer.style.backgroundImage = ''; 
                    return;
                }
                
                const ctx = chart.ctx;
                if (!chart._rwv_crosshair) chart._rwv_crosshair = { x: null, y: null };
                
                if (isHovered) {
                    const activePoint = chart.tooltip._active[0];
                    const { x: tx, y: ty } = activePoint.element.tooltipPosition();
                    
                    if (chart._rwv_crosshair.x === null) {
                        chart._rwv_crosshair.x = tx;
                        chart._rwv_crosshair.y = ty;
                    } else {
                        chart._rwv_crosshair.x += (tx - chart._rwv_crosshair.x) * 0.15;
                        chart._rwv_crosshair.y += (ty - chart._rwv_crosshair.y) * 0.15;
                    }
                    
                    if (Math.abs(tx - chart._rwv_crosshair.x) > 0.1 || Math.abs(ty - chart._rwv_crosshair.y) > 0.1) {
                        requestAnimationFrame(() => chart.render());
                    }
                }
                
                const x = chart._rwv_crosshair.x;
                const y = chart._rwv_crosshair.y;
                const o = chart._rwv_hover_opacity; 
                
                if (x === null || y === null) return;

                if (glowLayer) {
                    const canvasRect = chart.canvas.getBoundingClientRect();
                    const containerRect = container.getBoundingClientRect();
                    const relX = x + (canvasRect.left - containerRect.left);
                    const relY = y + (canvasRect.top - containerRect.top);
                    
                    glowLayer.style.backgroundImage = `radial-gradient(circle at ${relX}px ${relY}px, rgba(198, 243, 79, ${0.12 * o}) 0%, transparent 280px)`;
                }

                const topY = chart.scales.y.top;
                const bottomY = chart.scales.y.bottom;
                const leftX = chart.scales.x.left;
                const rightX = chart.scales.x.right;

                ctx.save();

                const gradY = ctx.createLinearGradient(0, topY, 0, bottomY);
                gradY.addColorStop(0, 'rgba(198, 243, 79, 0)');
                gradY.addColorStop(Math.max(0, Math.min(1, (y - topY) / (bottomY - topY))), `rgba(198, 243, 79, ${0.6 * o})`);
                gradY.addColorStop(1, 'rgba(198, 243, 79, 0)');

                const gradX = ctx.createLinearGradient(leftX, 0, rightX, 0);
                gradX.addColorStop(0, 'rgba(198, 243, 79, 0)');
                gradX.addColorStop(Math.max(0, Math.min(1, (x - leftX) / (rightX - leftX))), `rgba(198, 243, 79, ${0.6 * o})`);
                gradX.addColorStop(1, 'rgba(198, 243, 79, 0)');

                ctx.beginPath(); ctx.moveTo(x, topY); ctx.lineTo(x, bottomY);
                ctx.strokeStyle = gradY; ctx.lineWidth = 1; ctx.stroke();

                ctx.beginPath(); ctx.moveTo(leftX, y); ctx.lineTo(rightX, y);
                ctx.strokeStyle = gradX; ctx.lineWidth = 1; ctx.stroke();

                const meta = chart.getDatasetMeta(0);
                const points = meta.data;
                
                if (points.length > 0) {
                    ctx.beginPath();
                    ctx.moveTo(points[0].x, points[0].y);
                    for (let i = 1; i < points.length; i++) {
                        ctx.bezierCurveTo(points[i-1].cp2x, points[i-1].cp2y, points[i].cp1x, points[i].cp1y, points[i].x, points[i].y);
                    }
                    
                    const lineGrad = ctx.createRadialGradient(x, y, 0, x, y, 200);
                    lineGrad.addColorStop(0, `rgba(198, 243, 79, ${1 * o})`);
                    lineGrad.addColorStop(1, 'rgba(198, 243, 79, 0)');
                    
                    ctx.strokeStyle = lineGrad;
                    ctx.lineWidth = meta.dataset.options.borderWidth || 2; 
                    ctx.stroke();
                }

                ctx.beginPath();
                ctx.arc(x, y, 6, 0, 2 * Math.PI);
                ctx.fillStyle = `rgba(11, 16, 17, ${o})`;
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = `rgba(198, 243, 79, ${o})`;
                ctx.shadowColor = `rgba(198, 243, 79, ${o})`;
                ctx.shadowBlur = 10;
                ctx.stroke();

                ctx.restore();
            }
        };
        Chart.register(verticalUnderfillPlugin, advancedHoverPlugin);

        // --- DASHBOARD CHART COMPONENT ---
        function ProjectionChart({ data, commodityLabel, isSimulating }) {
            const canvasRef = useRef(null);
            const chartInstanceRef = useRef(null);

            useEffect(() => {
                if (!canvasRef.current || !data || data.length === 0) return;

                const labels = data.map(d => `+${d.day} dní`);
                const prices = data.map(d => d.price);

                if (!chartInstanceRef.current) {
                    const ctx = canvasRef.current.getContext('2d');

                    chartInstanceRef.current = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels,
                            datasets: [{
                                label: `Predikce`,
                                data: prices,
                                borderColor: '#C6F34F',
                                backgroundColor: 'rgba(198, 243, 79, 0.15)',
                                borderWidth: 2,
                                tension: 0.4, 
                                pointRadius: 0, 
                                pointHoverRadius: 0, 
                                fill: true,
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            animation: { duration: 600, easing: 'easeOutQuart' },
                            hover: { animationDuration: 400 }, 
                            interaction: { intersect: false, mode: 'index' },
                            plugins: {
                                legend: { display: false },
                                tooltip: {
                                    enabled: true,
                                    backgroundColor: '#151E20', titleColor: '#6B8286',
                                    bodyColor: '#C6F34F', borderColor: '#232E30',
                                    borderWidth: 1, padding: 12, displayColors: false,
                                    titleFont: { size: 11, family: 'system-ui' },
                                    bodyFont: { size: 14, family: 'system-ui', weight: 'bold' },
                                    animation: { duration: 400, easing: 'easeOutQuart' }, 
                                    callbacks: {
                                        title: (ctx) => ctx[0].label,
                                        label: (ctx) => '$' + ctx.parsed.y.toFixed(2)
                                    }
                                }
                            },
                            scales: {
                                x: { ticks: { color: '#6B8286', font: { size: 11, family: 'system-ui' } }, grid: { display: false } },
                                y: { ticks: { color: '#6B8286', font: { size: 11, family: 'system-ui' } }, grid: { display: false } }
                            }
                        }
                    });
                } else {
                    chartInstanceRef.current.data.labels = labels;
                    chartInstanceRef.current.data.datasets[0].data = prices;
                    chartInstanceRef.current.update(); 
                }
            }, [data, commodityLabel]);

            useEffect(() => {
                return () => { if (chartInstanceRef.current) chartInstanceRef.current.destroy(); }
            }, []);

            return (
                <div className="relative w-full h-[500px] premium-panel p-6 shadow-2xl flex-1 flex flex-col overflow-hidden">
                    
                    <div className="absolute top-[-140px] left-1/2 -translate-x-1/2 w-[400px] h-[200px] bg-rwv-lime rounded-full blur-[150px] opacity-10 pointer-events-none z-0"></div>

                    <div className="flex justify-between items-center mb-4 z-20">
                        <h3 className="text-lg font-bold text-white tracking-wide">Trajektorie Monte Carlo</h3>
                        
                        <div className="h-6 flex items-center">
                            {isSimulating || data === INITIAL_DUMMY_CURVE || data.length === 0 ? (
                                <span className="text-rwv-lime text-xs font-bold animate-pulse tracking-widest bg-rwv-lime/10 px-3 py-1 rounded-md shadow-[0_0_10px_rgba(198,243,79,0.2)]">
                                    PŘEPOČÍTÁVÁM SDE
                                </span>
                            ) : (
                                <span className="text-xs text-rwv-textMuted flex items-center gap-2">
                                    <div className="w-2 h-2 rounded-full bg-rwv-lime"></div>
                                    Synchronizováno
                                </span>
                            )}
                        </div>
                    </div>
                    
                    <div className="relative flex-1 w-full z-20">
                        <canvas ref={canvasRef}></canvas>
                    </div>
                </div>
            );
        }

        // --- MATH ENGINE SVG SIMULATION DIAGRAM ---
        function MathSimulationTab() {
            const [phase, setPhase] = useState(0); 

            useEffect(() => {
                let timer;
                if (phase > 0 && phase < 9) {
                    timer = setTimeout(() => { setPhase(p => p + 1); }, 4000); 
                } else if (phase === 9) {
                    timer = setTimeout(() => { setPhase(0); }, 7000); 
                }
                return () => clearTimeout(timer);
            }, [phase]);

            const triggerPlay = () => {
                if (phase === 0) setPhase(1);
                else setPhase(0);
            };

            const nodes = {
                wb: { x: 10, y: 30, label: "Světová Banka", phase: 1 },
                fred: { x: 10, y: 100, label: "FRED Makro", phase: 1 },
                meteo: { x: 10, y: 170, label: "Open-Meteo", phase: 1 },
                eia: { x: 10, y: 240, label: "EIA Fyzická Data", phase: 1 },
                yf: { x: 10, y: 310, label: "yfinance (Rozdíly)", phase: 1 },
                fut: { x: 10, y: 380, label: "Expirace Futures", phase: 1 },

                l_it: { x: 170, y: 30, label: "Základ. Ekon. L(it)", phase: 2 },
                f_it: { x: 170, y: 100, label: "Volatil. Ekon. F(it)", phase: 2 },
                v_t: { x: 170, y: 170, label: "Fund. Riziko V(t)", phase: 2 },
                f_r: { x: 170, y: 240, label: "Fin. Stres F(r)", phase: 2 },
                lam: { x: 170, y: 310, label: "Intenzita Def. Λ(it)", phase: 2 },
                buf: { x: 170, y: 380, label: "Adapt. Polštář B(it)", phase: 2 },

                A: { x: 330, y: 65, label: "Aktivita (A)", phase: 3 },
                R: { x: 330, y: 205, label: "Riziko (R)", phase: 3 },
                D: { x: 330, y: 345, label: "Deficit (D)", phase: 3 },

                madr: { x: 490, y: 65, label: "MADR (a, d, r)", phase: 4 },
                regime: { x: 490, y: 160, label: "Markov Režim z(t)", phase: 4 },
                shock: { x: 490, y: 255, label: "Index Šoku Q(t)", phase: 4 },
                season: { x: 490, y: 350, label: "Sezónnost S(t)", phase: 4 },

                M_target: { x: 650, y: 65, label: "Základní Cíl M(it)", phase: 5 },
                y_carry: { x: 650, y: 255, label: "Náklad Držby c(it)", phase: 5 },

                dm_base: { x: 810, y: 65, label: "Základní SDE dm(t)", phase: 6 },
                dx_mkt: { x: 810, y: 160, label: "Tržní SDE dx(t)", phase: 6 },

                kalman: { x: 970, y: 110, label: "Kalman Filtr P(str)", phase: 7 },
                f_mkt: { x: 970, y: 230, label: "Tržní Křivka f(mkt)", phase: 7 },
                rp: { x: 970, y: 310, label: "Riziková Přirážka RP", phase: 7 },

                alpha: { x: 1130, y: 170, label: "Strukt. Váha (α)", phase: 8 },
                omega: { x: 1130, y: 270, label: "Časová Interpol. (ω)", phase: 8 },

                curve: { x: 1290, y: 220, label: "Křivka 27 Kroků", phase: 9 }
            };

            const connections = [
                { from: 'wb', to: 'l_it', reqPhase: 2 }, { from: 'wb', to: 'v_t', reqPhase: 2 },
                { from: 'fred', to: 'f_it', reqPhase: 2 }, { from: 'fred', to: 'f_r', reqPhase: 2 }, { from: 'fred', to: 'lam', reqPhase: 2 },
                { from: 'meteo', to: 'lam', reqPhase: 2 }, { from: 'eia', to: 'lam', reqPhase: 2 }, { from: 'eia', to: 'buf', reqPhase: 2 },
                { from: 'yf', to: 'lam', reqPhase: 2 },
                { from: 'l_it', to: 'A', reqPhase: 3 }, { from: 'f_it', to: 'A', reqPhase: 3 },
                { from: 'v_t', to: 'R', reqPhase: 3 }, { from: 'f_r', to: 'R', reqPhase: 3 },
                { from: 'lam', to: 'D', reqPhase: 3 }, { from: 'buf', to: 'D', reqPhase: 3 },

        // --- AUTHENTICATION SCREEN ---
        function AuthScreen({ onAuth }) {
            const [isLogin, setIsLogin] = useState(true);

            const [password, setPassword] = useState('');
            const [error, setError] = useState(null);
            const [loading, setLoading] = useState(false);

            const handleSubmit = async () => {
                setError(null);
                setLoading(true);
                const endpoint = isLogin ? '/api/v1/login' : '/api/v1/signup';
                
                try {
                    const res = await fetch(`${API_BASE}${endpoint}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                    
                    const data = await res.json();
                    
                    if (!res.ok) {
                        throw new Error(data.detail || 'Neznámá chyba autentizace');
                    }
                    
                    if (isLogin) {
                        onAuth(data.access_token);
                    } else {
                        setIsLogin(true);
                        setError("Účet vytvořen. Nyní se můžete přihlásit.");
                        setPassword('');
                    }
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="flex flex-col items-center justify-center min-h-screen bg-rwv-bg font-sans relative overflow-hidden animate-fade-in">
                    
                    {/* Animated Background SVG Lines */}

                                <filter id="line-glow" x="-20%" y="-20%" width="140%" height="140%">

                            </defs>
                            <path className="floating-line-1" d="M-100,400 Q150,250 350,350 T650,200 T950,300 T1100,100" fill="none" stroke="#C6F34F" strokeWidth="2" filter="url(#line-glow)" style={{filter: 'blur(3px)'}}/>
                            <path className="floating-line-2" d="M-100,450 Q200,350 400,200 T700,350 T900,150 T1100,250" fill="none" stroke="#758749" strokeWidth="3" filter="url(#line-glow)" style={{filter: 'blur(5px)'}}/>
                            <path className="floating-line-3" d="M-100,250 Q100,150 300,200 T600,100 T800,250 T1100,50" fill="none" stroke="#C6F34F" strokeWidth="1.5" filter="url(#line-glow)" style={{filter: 'blur(2px)'}}/>

                    </div>

                    {/* Liquid Glass Auth Box */}

                        </div>
                        <h2 className="text-xl font-bold text-white mb-6 text-center tracking-wide drop-shadow-md">
                            {isLogin ? 'Přístup do terminálu' : 'Registrace operátora'}

                        {error && <div className={`text-xs mb-4 text-center font-bold px-3 py-2 rounded border backdrop-blur-md ${error.includes('vytvořen') ? 'bg-green-900/40 text-green-300 border-green-500/50' : 'bg-red-900/40 text-red-300 border-red-500/50'}`}>{error}</div>}
                        
                        <input

        // --- MAIN APP COMPONENT ---
        function App() {
            const [token, setToken] = useState(localStorage.getItem('rwv_token'));
            
            const [appReady, setAppReady] = useState(false);
            const [loadProgress, setLoadProgress] = useState(0);

            const [viewTab, setViewTab] = useState('dashboard'); 
            const [selectedCommodityId, setSelectedCommodityId] = useState("Gold");
            const [defaultPredictions, setDefaultPredictions] = useState(null);
            
            const [chartData, setChartData] = useState(INITIAL_DUMMY_CURVE);
            const [healthData, setHealthData] = useState(null);
            
            const [sliders, setSliders] = useState({ A_it: 0.5, D_it: 0.5, R_it: 0.5 });
            const [isSimulating, setIsSimulating] = useState(false);
            const [error, setError] = useState(null);

            const handleLogout = () => {
                localStorage.removeItem('rwv_token');
                setToken(null);
            };

            const getAuthHeaders = () => ({
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            });

            const handleApiError = (res) => {
                if (res.status === 401) {
                    handleLogout();
                    throw new Error("Relace vypršela. Přihlaste se znovu.");
                }
                return res.json();
            };

            // Fast Loading Animation
            useEffect(() => {
                if (!token) return; // Don't run app load animation if on auth screen
                const interval = setInterval(() => {
                    setLoadProgress(p => {
                        if (p >= 100) {
                            clearInterval(interval);
                            setTimeout(() => setAppReady(true), 200);
                            return 100;
                        }
                        return p + 6; 
                    });
                }, 40); 
                return () => clearInterval(interval);
            }, [token]);

            // Background Data Fetching (Requires Auth)
            useEffect(() => {
                if (!token) return;
                
                Promise.all([
                    fetch(`${API_BASE}/api/v1/predict`, { headers: getAuthHeaders() }).then(handleApiError),
                    fetch(`${API_BASE}/api/v1/data-status`, { headers: getAuthHeaders() }).then(handleApiError)
                ])
                .then(([predictRes, healthRes]) => {
                    if (predictRes.status === "success" && predictRes.data) {
                        setDefaultPredictions(predictRes.data);
                        setHealthData(healthRes.indices);
                    } else {
                        setError("Cache jádra čeká. Spusťte výpočty.");
                    }
                })
                .catch(err => {
                    if(err.message !== "Relace vypršela. Přihlaste se znovu.") {
                        setError("Chyba připojení k RWV API.");
                    }
                });
            }, [token]);

            // Set Chart when Commodity Changes
            useEffect(() => {
                if (defaultPredictions && defaultPredictions[selectedCommodityId]) {
                    const data = defaultPredictions[selectedCommodityId];
                    setChartData(data.projection_curve);
                }
            }, [selectedCommodityId, defaultPredictions]);

            // Debounced Custom Slider Simulation
            useEffect(() => {
                if (!defaultPredictions || !token) return;
                const timer = setTimeout(() => {
                    setIsSimulating(true);
                    fetch(`${API_BASE}/api/v1/simulate-custom`, {
                        method: 'POST',
                        headers: getAuthHeaders(),
                        body: JSON.stringify({
                            commodity: selectedCommodityId,
                            A_it: parseFloat(sliders.A_it),
                            D_it: parseFloat(sliders.D_it),
                            R_it: parseFloat(sliders.R_it)
                        })
                    })
                    .then(handleApiError)
                    .then(data => {
                        if(data.status === "success") { setChartData(data.projection_curve); }
                        setIsSimulating(false);
                    })
                    .catch(err => {
                        console.error("Simulation failed", err);
                        setIsSimulating(false);
                    });
                }, 400); 

                return () => clearTimeout(timer);
            }, [sliders, selectedCommodityId, token]);

            const handleSliderChange = (e, key) => {
                setSliders(prev => ({ ...prev, [key]: parseFloat(e.target.value) }));
            };

            // RENDER AUTH SCREEN
            if (!token) {
                return <AuthScreen onAuth={(t) => {
                    localStorage.setItem('rwv_token', t);
                    setToken(t);
                }} />;
            }

            // LOADING SCREEN RENDER
            if (!appReady) {
                return (
                    <div className="flex flex-col items-center justify-center min-h-screen bg-rwv-bg">
                        <img src="https://raw.githubusercontent.com/trail-blazer2/rwv-app/refs/heads/main/logow.png" className="mb-8 h-12 object-contain opacity-80" />
                        <div className="w-64 h-2 bg-rwv-panel rounded-full overflow-hidden border border-rwv-border">
                            <div className="h-full bg-rwv-lime transition-all duration-75 ease-linear" style={{ width: `${loadProgress}%` }}></div>
                        </div>
                        <p className="mt-4 text-[10px] font-sans font-medium text-rwv-textMuted uppercase tracking-widest">Ověřuji spojení a načítám modely...</p>
                    </div>
                );
            }

            if (error) return <div className="flex items-center justify-center min-h-screen text-red-500 font-sans font-semibold">{error}</div>;

            const spotPrice = defaultPredictions?.[selectedCommodityId]?.spot_price || 0.00;
            const currentLabel = COMMODITIES.find(c => c.id === selectedCommodityId)?.label || selectedCommodityId;

            return (
                <div className="flex flex-col h-screen overflow-hidden animate-fade-in">
                    
                    {/* Top Global Navigation Bar */}

                        <div className="flex items-center gap-4">
                            <img src="https://raw.githubusercontent.com/trail-blazer2/rwv-app/refs/heads/main/logow.png" alt="Logo" className="h-8 object-contain opacity-90" />

                            <div className="flex gap-2 bg-rwv-bg p-1 rounded-lg border border-rwv-border">
                                <button 
                                    onClick={() => setViewTab('dashboard')}

                                >
                                    Výstupní Matice
                                </button>
                                <button 
                                    onClick={() => setViewTab('simulation')}
                                    className={`px-4 py-1.5 text-xs font-bold uppercase tracking-wider rounded-md transition ${viewTab === 'simulation' ? 'bg-rwv-panel text-white shadow' : 'text-gray-500 hover:text-gray-300'}`}
                                >
                                    Matematický Model
                                </button>

                                    onClick={() => setViewTab('health')}

                                >
                                    Zdraví Dat

                                onClick={handleLogout}

                            >
                                Odhlásit
                            </button>
                        </div>
                    </div>

                    {/* Main Workspace Split */}
                    <div className="flex-1 flex overflow-hidden">
                        
                        {/* Persistent Sidebar */}
                        {viewTab === 'dashboard' && (
                            <div className="w-[340px] bg-rwv-panel border-r border-rwv-border flex flex-col shadow-xl z-20 shrink-0">
                                <div className="flex-1 overflow-y-auto p-6 custom-scrollbar flex flex-col gap-8">
                                    <div>
                                        <h2 className="text-[10px] font-bold text-rwv-textMuted uppercase tracking-widest mb-3">Cílové Aktivum</h2>
                                        <div className="grid grid-cols-2 gap-2">
                                            {COMMODITIES.map(c => (
                                                <button
                                                    key={c.id}
                                                    onClick={() => setSelectedCommodityId(c.id)}
                                                    className={`w-full text-center px-2 py-2.5 rounded-lg text-sm font-bold transition-all duration-300 border ${
                                                        selectedCommodityId === c.id 
                                                        ? 'bg-gradient-to-br from-rwv-darkolive to-rwv-olive text-white border-transparent' 
                                                        : 'bg-rwv-bg text-gray-400 border-rwv-border hover:border-rwv-textMuted hover:text-white'
                                                    }`}
                                                >
                                                    {c.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <hr className="border-rwv-border" />

                                    <div>
                                        <h2 className="text-[10px] font-bold text-rwv-textMuted uppercase tracking-widest mb-4">Živé Ladění Parametrů</h2>
                                        <div className="flex flex-col gap-6">
                                            <SidebarSlider title="Ekonomická Aktivita (A)" value={sliders.A_it} onChange={(e) => handleSliderChange(e, 'A_it')} />
                                            <SidebarSlider title="Intenzita Deficitu (D)" value={sliders.D_it} onChange={(e) => handleSliderChange(e, 'D_it')} />
                                            <SidebarSlider title="Systémové Riziko (R)" value={sliders.R_it} onChange={(e) => handleSliderChange(e, 'R_it')} />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Dynamic Main View */}
                        {viewTab === 'dashboard' ? (
                            <div className="flex-1 p-8 overflow-y-auto flex flex-col relative bg-rwv-bg">
                                <header className="flex justify-between items-end mb-6">
                                    <div>
                                        <div className="flex items-center gap-2 mb-1">
                                            <span className="text-rwv-textMuted text-sm font-medium">Trh /</span>
                                            <span className="text-rwv-lime text-sm font-bold uppercase tracking-wider">{currentLabel}</span>
                                        </div>
                                        <h2 className="text-4xl font-bold text-white tracking-tight">{currentLabel} <span className="text-gray-500 font-light">/ USD</span></h2>
                                    </div>
                                    <div className="text-right">
                                        <p onClick={() => setViewTab('debug')} className="text-xs text-rwv-textMuted uppercase tracking-widest mb-1">Spotová Cena</p>
                                        <p className="text-4xl font-sans font-semibold text-white">${spotPrice.toFixed(2)}</p>
                                    </div>
                                </header>
                                <ProjectionChart 
                                    data={chartData} 
                                    commodityLabel={currentLabel} 
                                    isSimulating={isSimulating || !defaultPredictions} 
                                />
                                <Phase3LockedFeatures />
                            </div>
                        ) : viewTab === 'simulation' ? (
                            <MathSimulationTab />
                        ) : viewTab === 'health' ? (
                            // Data Health Tab
                            <div className="flex-1 p-10 overflow-y-auto bg-rwv-bg font-sans">
                                <div className="max-w-4xl mx-auto">
                                    <h2 className="text-3xl font-bold text-white mb-2 border-b border-rwv-border pb-4">Stav Datového Toku</h2>
                                    
                                    {healthData ? (
                                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mt-8">
                                            {Object.entries(healthData).map(([category, metrics]) => (
                                                <div key={category} className="bg-rwv-panel p-6 rounded-xl border border-rwv-border shadow-xl">
                                                    <h4 className="text-xs font-bold uppercase text-rwv-textMuted mb-4 tracking-widest border-b border-rwv-border pb-2">
                                                        {TRANSLATIONS[category] || category.replace('_', ' ')}
                                                    </h4>
                                                    <ul className="space-y-3">
                                                        {Object.entries(metrics).map(([key, info]) => (
                                                            <li key={key} className="flex justify-between items-center text-sm">
                                                                <span className="text-gray-300" title={TRANSLATIONS[key] || key}>
                                                                    {TRANSLATIONS[key] || key.replace('_', ' ')}
                                                                </span>
                                                                <span className={`font-sans font-semibold text-xs px-2 py-1 rounded ${info.status.includes('OK') ? 'bg-green-900/30 text-green-400' : 'bg-yellow-900/30 text-yellow-400'}`}>
                                                                    {info.status}
                                                                </span>
                                                            </li>
                                                        ))}
                                                    </ul>
                                                </div>
                                            ))}
                                        </div>
                                    ) : (
                                        <div className="mt-8 text-gray-500 font-semibold tracking-wide">Načítám stav datových zdrojů API...</div>
                                    )}
                                </div>
                            </div>
                        ) : (
                            // Debug/Dev Tab (Hidden trigger)
                            <div className="flex-1 p-10 overflow-y-auto bg-rwv-bg font-sans">
                                <div className="max-w-3xl mx-auto">
                                    <h2 className="text-3xl font-bold text-yellow-400 mb-2 border-b border-yellow-400/20 pb-4">Výstup pro vývojáře (Debug)</h2>
                                    <div className="mb-8 mt-6">
                                        <span className="text-rwv-textMuted uppercase tracking-widest text-xs font-semibold">Aktivní datový tok komodity</span>
                                        <div className="text-2xl text-white mt-1 font-semibold">{currentLabel} / USD</div>
                                    </div>
                                    <div className="bg-rwv-panel p-6 rounded-xl border border-rwv-border shadow-xl">
                                        <h3 className="text-gray-300 text-sm font-bold mb-4 uppercase tracking-wider">Surová matice 27 kroků projekce</h3>
                                        {chartData.length > 0 ? (
                                            <ul className="space-y-2 text-sm">
                                                {chartData.map((d, i) => (
                                                    <li key={i} className="flex justify-between border-b border-rwv-border/50 pb-1 hover:bg-rwv-border/30 px-2 rounded transition">
                                                        <span className="text-gray-500 font-semibold">Krok {i+1} <span className="text-gray-600">({d.day} dní)</span></span>
                                                        <span className="text-rwv-lime font-bold">${d.price.toFixed(2)}</span>
                                                    </li>
                                                ))}
                                            </ul>
                                        ) : (
                                            <span className="text-red-400 font-semibold">Matice je prázdná. Žádná data nebyla vypočítána.</span>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // --- SIDEBAR SLIDER COMPONENT ---
        function SidebarSlider({ title, value, onChange }) {
            return (
                <div className="flex flex-col">
                    <div className="flex justify-between items-center mb-2">
                        <label className="text-xs font-semibold text-gray-300">{title}</label>
                        <span className="font-sans font-semibold text-xs text-rwv-olive bg-rwv-olive/10 px-2 py-0.5 rounded border border-rwv-olive/30">
                            {value.toFixed(2)}
                        </span>
                    </div>
                    <input type="range" min="0.00" max="1.00" step="0.01" value={value} onChange={onChange} />
                    <div className="flex justify-between text-[10px] text-rwv-textMuted mt-1.5 font-sans font-medium">
                        <span>0.00</span>
                        <span>1.00</span>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
