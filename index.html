<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RWV Forecasting Terminal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        rwv: {
                            bg: '#0B1011',       
                            panel: '#151E20',    
                            border: '#232E30',   
                            lime: '#C6F34F',     /* Bright active accent */
                            olive: '#758749',    /* Sidebar gradient to */

                        }
                    },

                        'fade-in': 'fadeIn 0.5s ease-out forwards',

                    keyframes: {

    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Sleek custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0B1011; }
        ::-webkit-scrollbar-thumb { background: #232E30; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #3a4a4d; }
        
        /* Range Slider Styling */
        input[type=range] { -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px; width: 14px;
            border-radius: 50%;
            background: #C6F34F;
            cursor: pointer; margin-top: -5px;
            box-shadow: 0 0 10px rgba(198, 243, 79, 0.4);
            transition: transform 0.1s ease;
        }
        input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px;
            cursor: pointer; background: #232E30; border-radius: 2px;
        }

        /* SVG Diagram Animations */
        .svg-node { transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .node-active {
            fill: #151E20 !important;
            stroke: #C6F34F !important;
        }
        .node-text-active { fill: #C6F34F !important; }
        
        .svg-path {
            stroke: #232E30;
            stroke-width: 1.5;
            transition: stroke 0.3s ease;
        }
        
        @keyframes dashMove { to { stroke-dashoffset: -24; } }
        
        .path-active {
            stroke: #C6F34F !important;
            stroke-dasharray: 8 8;
            animation: dashMove 0.8s linear infinite;
        }
    </style>
</head>
<body class="bg-rwv-bg text-gray-200 min-h-screen font-sans selection:bg-rwv-lime selection:text-rwv-bg overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const API_BASE = "https://ivanmazurov--rwv-engine-production-fastapi-app.modal.run"; 
        
        const COMMODITIES = [
            { id: "Gold", label: "Zlato" }, { id: "Gas", label: "Plyn" },
            { id: "Brent", label: "Ropa Brent" }, { id: "Copper", label: "Měď" },
            { id: "Palladium", label: "Palladium" }, { id: "Platinum", label: "Platina" },
            { id: "Cocoa", label: "Kakao" }, { id: "Silver", label: "Stříbro" }
        ];

        const TRANSLATIONS = {
            economic_activity: "Ekonomická aktivita", deficit: "Deficitní indikátory", systemic_risk: "Systémové riziko",
            gdp_ppp: "HDP (Parita kupní síly)", gdp_growth: "Růst HDP", peoples_income: "Příjmy obyvatelstva",
            unemployment: "Míra nezaměstnanosti", inflation: "Míra inflace", population: "Populační růst",
            fdi: "Přímé zahr. investice", pmi: "Index nákupních manažerů", inventories: "Aktuální zásoby",
            production: "Objem produkce", max_production: "Maximální kapacita", consumption: "Úroveň spotřeby",
            regulations: "Regulace a sankce", logistics: "Zpoždění logistiky", weather: "Klimatické anomálie",
            spread: "Prostorové rozdíly (Spread)", government_debt: "Vládní dluhové zatížení", interest_rate: "Úrokové sazby",
            gini: "Giniho koeficient (Nerovnost)", poverty_rate: "Míra chudoby", defense_spend: "Výdaje na obranu",
            rnd_spend: "Výdaje na vědu a výzkum", edu_spend: "Výdaje na školství", health_spend: "Výdaje na zdravotnictví",
            net_migration: "Čistá migrace", dxy: "Dolarový index (DXY)"
        };

        // --- CUSTOM CHART PLUGINS ---
        
        // 1. Vertical Lines strictly inside the filled graph, matched exactly to Data Points
        const verticalUnderfillPlugin = {
            id: 'verticalUnderfill',
            beforeDatasetsDraw: (chart) => {
                const ctx = chart.ctx;
                const meta = chart.getDatasetMeta(0);
                if (!meta || !meta.data.length) return;
                
                const topY = chart.chartArea.top;
                const bottomY = chart.chartArea.bottom;
                
                ctx.save();
                // Create clipping mask to restrict drawing exactly to the filled area
                ctx.beginPath();
                ctx.moveTo(meta.data[0].x, bottomY);
                meta.data.forEach(p => ctx.lineTo(p.x, p.y));
                ctx.lineTo(meta.data[meta.data.length - 1].x, bottomY);
                ctx.closePath();
                ctx.clip();
                
                // Draw vertical lines ONLY at exact data point X coordinates
                ctx.beginPath();
                meta.data.forEach(p => {
                    ctx.moveTo(p.x, topY);
                    ctx.lineTo(p.x, bottomY);
                });
                ctx.strokeStyle = 'rgba(198, 243, 79, 0.08)'; 
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.restore();
            }
        };

        // 2. Complete Rendering Control: Dark Mode Hover, Fading Segment, Point Easing
        const advancedHoverPlugin = {
            id: 'advancedHover',
            afterEvent: (chart, args) => {
                const e = args.event;
                if (e.type === 'mousemove' && e.inChartArea) {
                    chart._isHovered = true;
                } else if (e.type === 'mouseout') {
                    chart._isHovered = false;
                }
                chart.draw();
            },
            beforeDatasetsDraw: (chart) => {
                const ctx = chart.ctx;
                const isHovered = chart._isHovered;
                
                // Toggle Base Line Color
                chart.data.datasets[0].borderColor = isHovered ? '#3a4722' : '#C6F34F';
                
                // Toggle Base Fill Gradient
                const topY = chart.chartArea.top;
                const bottomY = chart.chartArea.bottom;
                const grad = ctx.createLinearGradient(0, topY, 0, bottomY);
                if (isHovered) {
                    grad.addColorStop(0, 'rgba(58, 71, 34, 0.2)'); 
                    grad.addColorStop(1, 'rgba(58, 71, 34, 0)');
                } else {
                    grad.addColorStop(0, 'rgba(198, 243, 79, 0.15)'); 
                    grad.addColorStop(1, 'rgba(198, 243, 79, 0)');
                }
                chart.data.datasets[0].backgroundColor = grad;
            },
            afterDatasetsDraw: (chart) => {
                // Must draw AFTER datasets but BEFORE tooltips to guarantee Z-Index is correct
                if (!chart._isHovered || !chart.tooltip?._active?.length) {
                    window.dispatchEvent(new CustomEvent('chartMouseOut'));
                    return;
                }
                
                const activePoint = chart.tooltip._active[0];
                const ctx = chart.ctx;
                
                // Natively smoothed coordinates that ease perfectly between points
                const { x, y } = activePoint.element.tooltipPosition();
                
                const topY = chart.scales.y.top;
                const bottomY = chart.scales.y.bottom;
                const leftX = chart.scales.x.left;
                const rightX = chart.scales.x.right;

                ctx.save();
                
                // Fading Crosshairs
                const gradY = ctx.createLinearGradient(0, topY, 0, bottomY);
                gradY.addColorStop(0, 'rgba(198, 243, 79, 0)');
                gradY.addColorStop(Math.max(0, Math.min(1, (y - topY) / (bottomY - topY))), 'rgba(198, 243, 79, 0.6)');
                gradY.addColorStop(1, 'rgba(198, 243, 79, 0)');

                const gradX = ctx.createLinearGradient(leftX, 0, rightX, 0);
                gradX.addColorStop(0, 'rgba(198, 243, 79, 0)');
                gradX.addColorStop(Math.max(0, Math.min(1, (x - leftX) / (rightX - leftX))), 'rgba(198, 243, 79, 0.6)');
                gradX.addColorStop(1, 'rgba(198, 243, 79, 0)');

                ctx.beginPath(); ctx.moveTo(x, topY); ctx.lineTo(x, bottomY);
                ctx.strokeStyle = gradY; ctx.lineWidth = 1; ctx.stroke();

                ctx.beginPath(); ctx.moveTo(leftX, y); ctx.lineTo(rightX, y);
                ctx.strokeStyle = gradX; ctx.lineWidth = 1; ctx.stroke();

                // Faded Line Segment (Constant Thickness, perfectly traces curve)
                const meta = chart.getDatasetMeta(0);
                const points = meta.data;
                
                if (points.length > 0) {
                    ctx.beginPath();
                    ctx.moveTo(points[0].x, points[0].y);
                    for (let i = 1; i < points.length; i++) {
                        ctx.bezierCurveTo(points[i-1].cp2x, points[i-1].cp2y, points[i].cp1x, points[i].cp1y, points[i].x, points[i].y);
                    }
                    
                    // Radial gradient mask makes the line visible only near the hovered point
                    const lineGrad = ctx.createRadialGradient(x, y, 0, x, y, 250);
                    lineGrad.addColorStop(0, '#C6F34F'); // Fully bright at hover point
                    lineGrad.addColorStop(1, 'rgba(198, 243, 79, 0)'); // Fades to nothing down the line
                    
                    ctx.strokeStyle = lineGrad;
                    ctx.lineWidth = 3; // Strict constant thickness
                    ctx.stroke();
                }

                // Solid Center Dot (Under the tooltip)
                ctx.beginPath();
                ctx.arc(x, y, 6, 0, 2 * Math.PI);
                ctx.fillStyle = '#0B1011';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#C6F34F';
                ctx.shadowColor = '#C6F34F';
                ctx.shadowBlur = 10;
                ctx.stroke();

                ctx.restore();

                // Broadcast the smoothed point coordinates to the HTML light cone
                window.dispatchEvent(new CustomEvent('chartHover', { detail: { x, y }}));
            }
        };
        Chart.register(verticalUnderfillPlugin, advancedHoverPlugin);

        // --- DASHBOARD CHART COMPONENT ---
        function ProjectionChart({ data, commodityLabel, isSimulating }) {
            const containerRef = useRef(null);
            const canvasRef = useRef(null);
            const chartInstanceRef = useRef(null);
            const coneRef = useRef(null);

            // The massive HTML Light Cone listener
            useEffect(() => {
                const handleHover = (e) => {
                    if (coneRef.current) {
                        const x = e.detail.x + 24; // Align to padding
                        const y = e.detail.y + 24;
                        coneRef.current.style.opacity = 1;
                        // Transform cleanly to center exactly on the smoothed point
                        coneRef.current.style.transform = `translate(calc(${x}px - 50%), calc(${y}px - 50%)) scale(1)`;
                    }
                };
                const handleMouseOut = () => {
                    if (coneRef.current) { coneRef.current.style.opacity = 0; }
                };
                window.addEventListener('chartHover', handleHover);
                window.addEventListener('chartMouseOut', handleMouseOut);
                return () => {
                    window.removeEventListener('chartHover', handleHover);
                    window.removeEventListener('chartMouseOut', handleMouseOut);
                };
            }, []);

            useEffect(() => {
                if (!canvasRef.current || !data || data.length === 0) return;

                const labels = data.map(d => `+${d.day} d`);
                const prices = data.map(d => d.price);

                if (!chartInstanceRef.current) {
                    const ctx = canvasRef.current.getContext('2d');
                    
                    const gradient = ctx.createLinearGradient(0, 0, 0, 400);
                    gradient.addColorStop(0, 'rgba(198, 243, 79, 0.15)');
                    gradient.addColorStop(1, 'rgba(198, 243, 79, 0)');

                    chartInstanceRef.current = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels,
                            datasets: [{
                                label: `Predikce`,
                                data: prices,
                                borderColor: '#C6F34F',
                                backgroundColor: gradient,
                                borderWidth: 2,
                                tension: 0.4, 
                                pointRadius: 0, 
                                pointHoverRadius: 0, 
                                fill: true,
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            animation: { duration: 600, easing: 'easeOutQuart' },
                            // This ensures the point easing transition takes 250ms
                            hover: { animationDuration: 250 },
                            interaction: { intersect: false, mode: 'index' },
                            plugins: {
                                legend: { display: false },
                                tooltip: {
                                    enabled: true,
                                    backgroundColor: '#151E20', titleColor: '#6B8286',
                                    bodyColor: '#C6F34F', borderColor: '#232E30',
                                    borderWidth: 1, padding: 12, displayColors: false,
                                    titleFont: { size: 11, family: 'system-ui' },
                                    bodyFont: { size: 14, family: 'system-ui', weight: 'bold' },
                                    animation: { duration: 250, easing: 'easeOutQuart' },
                                    callbacks: {
                                        title: (ctx) => ctx[0].label,
                                        label: (ctx) => '$' + ctx.parsed.y.toFixed(2)
                                    }
                                }
                            },
                            scales: {
                                x: { ticks: { color: '#6B8286', font: { size: 11, family: 'system-ui' } }, grid: { display: false } },
                                y: { ticks: { color: '#6B8286', font: { size: 11, family: 'system-ui' } }, grid: { display: false } }
                            }
                        }
                    });
                } else {
                    chartInstanceRef.current.data.labels = labels;
                    chartInstanceRef.current.data.datasets[0].data = prices;
                    chartInstanceRef.current.update(); 
                }
            }, [data, commodityLabel]);

            useEffect(() => {
                return () => { if (chartInstanceRef.current) chartInstanceRef.current.destroy(); }
            }, []);

            return (
                <div ref={containerRef} className="relative w-full h-[500px] bg-rwv-panel p-6 rounded-2xl border border-rwv-border shadow-2xl flex-1 flex flex-col overflow-hidden">
                    
                    {/* Massive Ambient Background Light (Top Edge) */}
                    <div className="absolute top-[-100px] left-1/2 -translate-x-1/2 w-[800px] h-[500px] bg-rwv-lime rounded-full blur-[150px] opacity-10 pointer-events-none z-0"></div>

                    {/* Massive Perfect Circle HTML Light Cone */}
                    <div 
                        ref={coneRef}
                        className="absolute w-[800px] h-[800px] rounded-full pointer-events-none z-10 transition-transform duration-250 ease-out"
                        style={{
                            background: 'radial-gradient(circle at 50% 50%, rgba(198,243,79,0.15) 0%, rgba(198,243,79,0) 50%)',
                            opacity: 0, top: 0, left: 0,
                            transform: 'translate(-50%, -50%) scale(0.8)',
                            mixBlendMode: 'screen'
                        }}
                    ></div>

                    <div className="flex justify-between items-center mb-4 z-20">
                        <h3 className="text-lg font-bold text-white tracking-wide">Trajektorie Monte Carlo</h3>
                        
                        <div className="h-6 flex items-center">
                            {isSimulating || data.length === 0 ? (
                                <span className="text-rwv-lime text-xs font-bold animate-pulse tracking-widest bg-rwv-lime/10 px-3 py-1 rounded-md shadow-[0_0_10px_rgba(198,243,79,0.2)]">
                                    PŘEPOČÍTÁVÁM SDE
                                </span>
                            ) : (
                                <span className="text-xs text-rwv-textMuted flex items-center gap-2">
                                    <div className="w-2 h-2 rounded-full bg-rwv-lime"></div>
                                    Synchronizováno
                                </span>
                            )}
                        </div>
                    </div>
                    
                    <div className="relative flex-1 w-full z-20">
                        <canvas ref={canvasRef}></canvas>
                    </div>
                </div>
            );
        }

        // --- MATH ENGINE SVG SIMULATION DIAGRAM ---
        function MathSimulationTab() {
            const [phase, setPhase] = useState(0); 

            useEffect(() => {
                let timer;
                if (phase > 0 && phase < 9) {
                    timer = setTimeout(() => { setPhase(p => p + 1); }, 4000); 
                } else if (phase === 9) {
                    timer = setTimeout(() => { setPhase(0); }, 7000); 
                }
                return () => clearTimeout(timer);
            }, [phase]);

            const triggerPlay = () => {
                if (phase === 0) setPhase(1);
                else setPhase(0);
            };

            const nodes = {
                wb: { x: 10, y: 30, label: "Světová Banka", phase: 1 },
                fred: { x: 10, y: 100, label: "FRED Makro", phase: 1 },
                meteo: { x: 10, y: 170, label: "Open-Meteo", phase: 1 },
                eia: { x: 10, y: 240, label: "EIA Fyzická Data", phase: 1 },
                yf: { x: 10, y: 310, label: "yfinance (Rozdíly)", phase: 1 },
                fut: { x: 10, y: 380, label: "Expirace Futures", phase: 1 },

                l_it: { x: 170, y: 30, label: "Základ. Ekon. L(it)", phase: 2 },
                f_it: { x: 170, y: 100, label: "Volatil. Ekon. F(it)", phase: 2 },
                v_t: { x: 170, y: 170, label: "Fund. Riziko V(t)", phase: 2 },
                f_r: { x: 170, y: 240, label: "Fin. Stres F(r)", phase: 2 },
                lam: { x: 170, y: 310, label: "Intenzita Def. Λ(it)", phase: 2 },
                buf: { x: 170, y: 380, label: "Adapt. Polštář B(it)", phase: 2 },

                A: { x: 330, y: 65, label: "Aktivita (A)", phase: 3 },
                R: { x: 330, y: 205, label: "Riziko (R)", phase: 3 },
                D: { x: 330, y: 345, label: "Deficit (D)", phase: 3 },

                madr: { x: 490, y: 65, label: "MADR (a, d, r)", phase: 4 },
                regime: { x: 490, y: 160, label: "Markov Režim z(t)", phase: 4 },
                shock: { x: 490, y: 255, label: "Index Šoku Q(t)", phase: 4 },
                season: { x: 490, y: 350, label: "Sezónnost S(t)", phase: 4 },

                M_target: { x: 650, y: 65, label: "Základní Cíl M(it)", phase: 5 },
                y_carry: { x: 650, y: 255, label: "Náklad Držby c(it)", phase: 5 },

                dm_base: { x: 810, y: 65, label: "Základní SDE dm(t)", phase: 6 },
                dx_mkt: { x: 810, y: 160, label: "Tržní SDE dx(t)", phase: 6 },

                kalman: { x: 970, y: 110, label: "Kalman Filtr P(str)", phase: 7 },
                f_mkt: { x: 970, y: 230, label: "Tržní Křivka f(mkt)", phase: 7 },
                rp: { x: 970, y: 310, label: "Riziková Přirážka RP", phase: 7 },

                alpha: { x: 1130, y: 170, label: "Strukt. Váha (α)", phase: 8 },
                omega: { x: 1130, y: 270, label: "Časová Interpol. (ω)", phase: 8 },

                curve: { x: 1290, y: 220, label: "Křivka 27 Kroků", phase: 9 }
            };

            const connections = [
                { from: 'wb', to: 'l_it', reqPhase: 2 }, { from: 'wb', to: 'v_t', reqPhase: 2 },
                { from: 'fred', to: 'f_it', reqPhase: 2 }, { from: 'fred', to: 'f_r', reqPhase: 2 }, { from: 'fred', to: 'lam', reqPhase: 2 },
                { from: 'meteo', to: 'lam', reqPhase: 2 }, { from: 'eia', to: 'lam', reqPhase: 2 }, { from: 'eia', to: 'buf', reqPhase: 2 },
                { from: 'yf', to: 'lam', reqPhase: 2 },
                { from: 'l_it', to: 'A', reqPhase: 3 }, { from: 'f_it', to: 'A', reqPhase: 3 },
                { from: 'v_t', to: 'R', reqPhase: 3 }, { from: 'f_r', to: 'R', reqPhase: 3 },
                { from: 'lam', to: 'D', reqPhase: 3 }, { from: 'buf', to: 'D', reqPhase: 3 },
                { from: 'A', to: 'madr', reqPhase: 4 }, { from: 'R', to: 'madr', reqPhase: 4 }, { from: 'D', to: 'madr', reqPhase: 4 },
                { from: 'A', to: 'regime', reqPhase: 4 }, { from: 'R', to: 'regime', reqPhase: 4 }, { from: 'D', to: 'regime', reqPhase: 4 },
                { from: 'D', to: 'shock', reqPhase: 4 }, { from: 'D', to: 'season', reqPhase: 4 }, 
                { from: 'madr', to: 'M_target', reqPhase: 5 }, { from: 'regime', to: 'M_target', reqPhase: 5 },
                { from: 'D', to: 'y_carry', reqPhase: 5 }, { from: 'regime', to: 'y_carry', reqPhase: 5 },
                { from: 'M_target', to: 'dm_base', reqPhase: 6 },
                { from: 'madr', to: 'dx_mkt', reqPhase: 6 }, { from: 'regime', to: 'dx_mkt', reqPhase: 6 }, 
                { from: 'shock', to: 'dx_mkt', reqPhase: 6 }, { from: 'season', to: 'dx_mkt', reqPhase: 6 },
                { from: 'dm_base', to: 'kalman', reqPhase: 7 }, { from: 'dx_mkt', to: 'kalman', reqPhase: 7 },
                { from: 'fut', to: 'f_mkt', reqPhase: 7 }, { from: 'y_carry', to: 'f_mkt', reqPhase: 7 },
                { from: 'kalman', to: 'alpha', reqPhase: 8 }, { from: 'f_mkt', to: 'alpha', reqPhase: 8 }, { from: 'rp', to: 'alpha', reqPhase: 8 },
                { from: 'alpha', to: 'omega', reqPhase: 8 },
                { from: 'omega', to: 'curve', reqPhase: 9 }
            ];

            const renderPath = (conn, i) => {
                const n1 = nodes[conn.from]; const n2 = nodes[conn.to];
                const startX = n1.x + 130; const startY = n1.y + 20; 
                const endX = n2.x; const endY = n2.y + 20;
                const cp1X = startX + (endX - startX) / 2;
                const pathD = `M ${startX} ${startY} C ${cp1X} ${startY}, ${cp1X} ${endY}, ${endX} ${endY}`;
                const isActive = phase >= conn.reqPhase;
                return ( <path key={i} d={pathD} fill="none" className={`svg-path ${isActive ? 'path-active' : ''}`} /> );
            };

            const panelData = [
                { title: "SYSTÉM NEČINNÝ", desc: "Čekám na příkaz ke spuštění matematického jádra.", metrics: [] },
                { title: "FÁZE 1: GLOBÁLNÍ INGESCE DAT", desc: "Získávání makro dat, fyzických fundamentů, prostorových rozdílů a expirací futures.", metrics: [{label: "Globální HDP", val: "+2.1%"}, {label: "Jádrová Inflace", val: "3.4%"}, {label: "Rozdíl bz-wti", val: "1.4"}, {label: "Exp. Futures", val: "N=4"}] },
                { title: "FÁZE 2: ROZDĚLENÍ DÍLČÍCH KOMPONENT", desc: "Rozdělení indikátorů na volatilní F(it) a základní L(it) meze. Vyhodnocení Intenzity Deficitu Λ(it).", metrics: [{label: "Volatilní F(it)", val: "0.62"}, {label: "Základní L(it)", val: "0.55"}, {label: "Intenzita Def. (Λ)", val: "1.44"}, {label: "Adapt. Polštář", val: "0.72"}] },
                { title: "FÁZE 3: HLAVNÍ MAKRO INDEXY", desc: "Syntéza normalizovaných matic A(it), D(it) a R(it) přes hyperbolické tangenty.", metrics: [{label: "Aktivita (A)", val: "0.58"}, {label: "Deficit (D)", val: "0.74"}, {label: "Systém. Riziko", val: "0.39"}] },
                { title: "FÁZE 4: MADR & MARKOVOVY REŽIMY", desc: "Centrování parametrů (a, d, r). Výpočet pravděpodobností přechodu π(k,t) pro určení aktivního stavu z(t).", metrics: [{label: "Vystředěno (a,d,r)", val: "[.16, .48, -.22]"}, {label: "Pravděp. (π)", val: "[.1, .2, .6, .1]"}, {label: "Aktivní Režim", val: "Stav 3"}] },
                { title: "FÁZE 5: CÍLE ROVNOVÁHY A DRŽBY", desc: "Výpočet dlouhodobého cíle rovnovážné ceny M(it). Sestavení výnosu y(it) a nákladů držby c(carry).", metrics: [{label: "Základní Cíl M(it)", val: "4.12"}, {label: "Výnos y(it)", val: "3.2%"}, {label: "Náklad c(carry)", val: "0.08"}] },
                { title: "FÁZE 6: SDE MONTE CARLO", desc: "Injekce proměnných do stochastických diferenciálních rovnic. Výpočet driftu Zákadní (dm) a Tržní (dx) vrstvy.", metrics: [{label: "Zákl. Drift (dm)", val: "+0.012"}, {label: "Trž. Drift (dx)", val: "-0.004"}, {label: "Cesty (N)", val: "10 000"}] },
                { title: "FÁZE 7: KALMAN A TRŽNÍ KŘIVKA", desc: "Aplikace Kalmanova filtru pro získání Strukturální Ceny P(str). Optimalizace Tržní Křivky f(mkt).", metrics: [{label: "Stav X(plus)", val: "[4.3, 0.1]"}, {label: "Strukt. P(str)", val: "83.15"}, {label: "Křivka f(mkt)", val: "81.90"}] },
                { title: "FÁZE 8: VÁŽENÍ A INTERPOLACE", desc: "Vážení P(str) vůči f(mkt) pomocí Váhy Nejistoty (α). Interpolace přesných dat expirace pomocí (ω).", metrics: [{label: "Nejistota (α)", val: "0.68"}, {label: "Rizik. Přirážka", val: "-0.40"}, {label: "Interpolace (ω)", val: "0.85"}] },
                { title: "FÁZE 9: KRYSTALIZACE VÝSTUPU", desc: "Agregace pravděpodobnostně vážených cest do finální 27krokové forwardové křivky.", metrics: [{label: "T_1 (15 dní)", val: "$82.10"}, {label: "T_2 (30 dní)", val: "$82.45"}, {label: "T_3 (45 dní)", val: "$82.60"}, {label: "T_27 (3 roky)", val: "$91.20"}] }
            ];

            return (
                <div className="flex-1 flex flex-col h-full overflow-hidden bg-rwv-bg">
                    <div className="flex-1 bg-rwv-panel m-6 mb-0 rounded-t-2xl border border-rwv-border p-6 flex flex-col relative shadow-2xl overflow-hidden">
                        <div className="flex justify-between items-center mb-6 shrink-0 z-10">
                            <div>
                                <h2 className="text-2xl font-bold text-white tracking-tight">Tok Matematické Architektury</h2>
                                <p className="text-rwv-textMuted text-sm mt-1">Telemetrie dat v reálném čase přes systém vzorců</p>
                            </div>
                            <button 
                                onClick={triggerPlay}
                                className={`px-6 py-2.5 rounded-lg font-bold text-xs uppercase tracking-widest transition-all ${phase > 0 ? 'bg-rwv-darkolive text-white border border-rwv-border hover:bg-rwv-border' : 'bg-rwv-lime text-rwv-bg hover:bg-rwv-lime/80 shadow-[0_0_15px_rgba(198,243,79,0.3)]'}`}
                            >
                                {phase > 0 ? "ZASTAVIT TELEMETRII" : "▶ SPUSTIT TELEMETRII"}
                            </button>
                        </div>
                        <div className="flex-1 w-full relative overflow-auto custom-scrollbar">
                            <div className="min-w-[1450px] min-h-[440px] w-full h-full relative">
                                <svg className="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 1450 440" preserveAspectRatio="xMidYMid meet">
                                    {connections.map((c, i) => renderPath(c, i))}
                                    {Object.entries(nodes).map(([key, n]) => {
                                        const isActive = phase >= n.phase;
                                        return (
                                            <g key={key} transform={`translate(${n.x}, ${n.y})`} className="svg-node">
                                                <rect width="130" height="40" rx="6" className={`fill-[#0B1011] stroke-2 ${isActive ? 'node-active' : 'stroke-rwv-border'}`} />
                                                <text x="65" y="24" textAnchor="middle" className={`text-[10px] font-bold font-sans ${isActive ? 'node-text-active' : 'fill-gray-500'}`}>
                                                    {n.label}
                                                </text>
                                            </g>
                                        );
                                    })}
                                </svg>
                            </div>
                        </div>
                    </div>
                    <div className="h-44 bg-rwv-panel border border-t-0 border-rwv-border mx-6 mb-6 rounded-b-2xl p-6 flex flex-col shrink-0 transition-all duration-300 shadow-2xl">
                        <div className="flex items-center gap-3 mb-2">
                            <div className={`w-2 h-2 rounded-full ${phase > 0 ? 'bg-rwv-lime animate-pulse' : 'bg-gray-600'}`}></div>
                            <h3 className="text-rwv-lime font-sans font-bold uppercase tracking-widest text-sm">{panelData[phase].title}</h3>
                        </div>
                        <p className="text-gray-400 text-xs mb-5 font-sans ml-5">{panelData[phase].desc}</p>
                        <div className="flex gap-4 ml-5">
                            {panelData[phase].metrics.map((m, i) => (
                                <div key={i} className="bg-rwv-bg border border-rwv-border rounded-lg p-3 min-w-[170px] flex flex-col justify-center transition-all duration-500 hover:border-rwv-lime/50 hover:bg-rwv-lime/5">
                                    <div className="text-rwv-textMuted text-[10px] uppercase font-bold tracking-wider mb-1">{m.label}</div>
                                    <div className="text-white font-sans font-semibold text-sm tracking-wide">{m.val}</div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        // --- PHASE 3 ADDONS (LOCKED) ---
        function Phase3LockedFeatures() {
            const features = ["Atribuce Faktorů", "Křivky Pravděpodobnosti", "Momentum Indexu"];
            return (
                <div className="mt-6 bg-rwv-panel rounded-2xl border border-rwv-border p-5">
                    <div className="flex items-center justify-between mb-4">
                        <h4 className="text-sm font-bold text-gray-300">Pokročilá Analytika (Fáze 3)</h4>
                        <span className="text-xs bg-rwv-border text-rwv-textMuted px-2 py-1 rounded-md uppercase tracking-wider font-bold">Připravuje se</span>
                    </div>
                    <div className="flex flex-wrap gap-4">
                        {features.map((feature, idx) => (
                            <div key={idx} className="flex items-center gap-3 bg-rwv-bg px-4 py-3 rounded-xl border border-rwv-border opacity-50 cursor-not-allowed select-none transition hover:opacity-70">
                                <div className="w-9 h-5 bg-rwv-border rounded-full relative">
                                    <div className="w-3 h-3 bg-rwv-textMuted rounded-full absolute left-1 top-1"></div>
                                </div>
                                <span className="text-sm text-gray-400 font-medium">{feature}</span>
                                <span className="ml-auto text-rwv-textMuted text-xs">🔒</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // --- HEALTH WIDGET COMPONENT ---
        function DataHealthWidget({ healthData }) {
            const [isOpen, setIsOpen] = useState(false);
            if (!healthData) return null;

            return (
                <div className="fixed bottom-6 right-6 z-50 w-80 bg-rwv-panel border border-rwv-border rounded-xl shadow-2xl transition-all duration-300">
                    <div 
                        className="p-4 flex justify-between items-center cursor-pointer rounded-t-xl hover:bg-rwv-border/50 transition"
                        onClick={() => setIsOpen(!isOpen)}
                    >
                        <div className="flex items-center gap-2">
                            <div className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                            <h3 className="font-bold text-sm text-gray-200">Stav Datového Toku</h3>
                        </div>
                        <span className="text-rwv-textMuted text-xs">{isOpen ? '▼' : '▲'}</span>
                    </div>
                    
                    {isOpen && (
                        <div className="p-4 max-h-80 overflow-y-auto custom-scrollbar bg-rwv-bg rounded-b-xl border-t border-rwv-border">
                            {Object.entries(healthData).map(([category, metrics]) => (
                                <div key={category} className="mb-4 last:mb-0">
                                    <h4 className="text-[10px] font-bold uppercase text-rwv-textMuted mb-2 tracking-widest border-b border-rwv-border pb-1">
                                        {TRANSLATIONS[category] || category.replace('_', ' ')}
                                    </h4>
                                    <ul className="space-y-1.5">
                                        {Object.entries(metrics).map(([key, info]) => (
                                            <li key={key} className="flex justify-between items-center text-xs">
                                                <span className="text-gray-400 truncate w-32" title={TRANSLATIONS[key] || key}>
                                                    {TRANSLATIONS[key] || key.replace('_', ' ')}
                                                </span>
                                                <span className={`font-sans font-semibold text-[10px] px-1.5 py-0.5 rounded ${info.status.includes('OK') ? 'bg-green-900/30 text-green-400' : 'bg-yellow-900/30 text-yellow-400'}`}>
                                                    {info.status}
                                                </span>
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        // --- MAIN APP COMPONENT ---
        function App() {
            const [appReady, setAppReady] = useState(false);
            const [loadProgress, setLoadProgress] = useState(0);

            const [viewTab, setViewTab] = useState('dashboard'); 
            const [selectedCommodityId, setSelectedCommodityId] = useState("Brent");
            const [defaultPredictions, setDefaultPredictions] = useState(null);
            const [chartData, setChartData] = useState([]);
            const [healthData, setHealthData] = useState(null);
            
            const [sliders, setSliders] = useState({ A_it: 0.5, D_it: 0.5, R_it: 0.5 });
            const [isSimulating, setIsSimulating] = useState(false);
            const [error, setError] = useState(null);

            // Fast Loading Animation
            useEffect(() => {
                const interval = setInterval(() => {
                    setLoadProgress(p => {
                        if (p >= 100) {
                            clearInterval(interval);
                            setTimeout(() => setAppReady(true), 200);
                            return 100;
                        }
                        return p + 6; 
                    });
                }, 40); 
                return () => clearInterval(interval);
            }, []);

            // Background Data Fetching
            useEffect(() => {
                Promise.all([
                    fetch(`${API_BASE}/api/v1/predict`).then(res => res.json()),
                    fetch(`${API_BASE}/api/v1/data-status`).then(res => res.json())
                ])
                .then(([predictRes, healthRes]) => {
                    if (predictRes.status === "success" && predictRes.data) {
                        setDefaultPredictions(predictRes.data);
                        setHealthData(healthRes.indices);
                    } else {
                        setError("Cache jádra čeká. Spusťte výpočty.");
                    }
                })
                .catch(err => {
                    setError("Chyba připojení k RWV API.");
                });
            }, []);

            // Set Chart when Commodity Changes
            useEffect(() => {
                if (defaultPredictions && defaultPredictions[selectedCommodityId]) {
                    const data = defaultPredictions[selectedCommodityId];
                    setSliders({ A_it: data.indices.A, D_it: data.indices.D, R_it: data.indices.R });
                    setChartData(data.projection_curve);
                }
            }, [selectedCommodityId, defaultPredictions]);

            // Debounced Custom Slider Simulation
            useEffect(() => {
                if (!defaultPredictions) return;
                const timer = setTimeout(() => {
                    setIsSimulating(true);
                    fetch(`${API_BASE}/api/v1/simulate-custom`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            commodity: selectedCommodityId,
                            A_it: parseFloat(sliders.A_it),
                            D_it: parseFloat(sliders.D_it),
                            R_it: parseFloat(sliders.R_it)
                        })
                    })
                    .then(res => res.json())
                    .then(data => {
                        if(data.status === "success") { setChartData(data.projection_curve); }
                        setIsSimulating(false);
                    })
                    .catch(err => {
                        console.error("Simulation failed", err);
                        setIsSimulating(false);
                    });
                }, 400); 

                return () => clearTimeout(timer);
            }, [sliders, selectedCommodityId]);

            const handleSliderChange = (e, key) => {
                setSliders(prev => ({ ...prev, [key]: parseFloat(e.target.value) }));
            };

            // LOADING SCREEN RENDER
            if (!appReady) {
                return (
                    <div className="flex flex-col items-center justify-center min-h-screen bg-rwv-bg">
                        <img src="https://placehold.co/240x80/0B1011/6B8286?text=LOGO+ZDE" alt="Logo" className="mb-8 h-12 object-contain opacity-80" />
                        <div className="w-64 h-2 bg-rwv-panel rounded-full overflow-hidden border border-rwv-border">
                            <div className="h-full bg-rwv-lime transition-all duration-75 ease-linear" style={{ width: `${loadProgress}%` }}></div>
                        </div>
                        <p className="mt-4 text-[10px] font-sans font-medium text-rwv-textMuted uppercase tracking-widest">Inicializace...</p>
                    </div>
                );
            }

            if (error) return <div className="flex items-center justify-center min-h-screen text-red-500 font-sans font-semibold">{error}</div>;

            const spotPrice = defaultPredictions?.[selectedCommodityId]?.spot_price || 0.00;
            const currentLabel = COMMODITIES.find(c => c.id === selectedCommodityId)?.label || selectedCommodityId;

            return (
                <div className="flex flex-col h-screen overflow-hidden animate-fade-in">
                    
                    {/* Top Global Navigation Bar */}
                    <div className="h-16 bg-rwv-panel border-b border-rwv-border flex items-center justify-between px-6 shrink-0 z-30">
                        <div className="flex items-center gap-4">
                            <img src="https://placehold.co/120x40/151E20/6B8286?text=LOGO+ZDE" alt="Logo" className="h-8 object-contain opacity-90" />
                        </div>
                        
                        <div className="flex gap-2 bg-rwv-bg p-1 rounded-lg border border-rwv-border">
                            <button 
                                onClick={() => setViewTab('dashboard')}
                                className={`px-4 py-1.5 text-xs font-bold uppercase tracking-wider rounded-md transition ${viewTab === 'dashboard' ? 'bg-rwv-panel text-white shadow' : 'text-gray-500 hover:text-gray-300'}`}
                            >
                                Výstupní Matice
                            </button>
                            <button 
                                onClick={() => setViewTab('simulation')}
                                className={`px-4 py-1.5 text-xs font-bold uppercase tracking-wider rounded-md transition ${viewTab === 'simulation' ? 'bg-rwv-panel text-white shadow' : 'text-gray-500 hover:text-gray-300'}`}
                            >
                                Matematický Model
                            </button>
                            <button 
                                onClick={() => setViewTab('debug')}
                                className={`px-4 py-1.5 text-xs font-bold uppercase tracking-wider rounded-md transition ${viewTab === 'debug' ? 'bg-rwv-panel text-yellow-400 shadow border border-yellow-400/20' : 'text-gray-500 hover:text-yellow-400/70'}`}
                            >
                                Ladění (Dev)
                            </button>
                        </div>
                    </div>

                    {/* Main Workspace Split */}
                    <div className="flex-1 flex overflow-hidden">
                        
                        {/* Persistent Sidebar */}
                        {viewTab === 'dashboard' && (
                            <div className="w-[340px] bg-rwv-panel border-r border-rwv-border flex flex-col shadow-xl z-20 shrink-0">
                                <div className="flex-1 overflow-y-auto p-6 custom-scrollbar flex flex-col gap-8">
                                    <div>
                                        <h2 className="text-[10px] font-bold text-rwv-textMuted uppercase tracking-widest mb-3">Cílové Aktivum</h2>
                                        <div className="grid grid-cols-2 gap-2">
                                            {COMMODITIES.map(c => (
                                                <button
                                                    key={c.id}
                                                    onClick={() => setSelectedCommodityId(c.id)}
                                                    className={`w-full text-center px-2 py-2.5 rounded-lg text-sm font-bold transition-all duration-300 border ${
                                                        selectedCommodityId === c.id 
                                                        ? 'bg-gradient-to-br from-rwv-darkolive to-rwv-olive text-white border-transparent' 
                                                        : 'bg-rwv-bg text-gray-400 border-rwv-border hover:border-rwv-textMuted hover:text-white'
                                                    }`}
                                                >
                                                    {c.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <hr className="border-rwv-border" />

                                    <div>
                                        <h2 className="text-[10px] font-bold text-rwv-textMuted uppercase tracking-widest mb-4">Živé Ladění Parametrů</h2>
                                        <div className="flex flex-col gap-6">
                                            <SidebarSlider title="Ekonomická Aktivita (A)" value={sliders.A_it} onChange={(e) => handleSliderChange(e, 'A_it')} />
                                            <SidebarSlider title="Intenzita Deficitu (D)" value={sliders.D_it} onChange={(e) => handleSliderChange(e, 'D_it')} />
                                            <SidebarSlider title="Systémové Riziko (R)" value={sliders.R_it} onChange={(e) => handleSliderChange(e, 'R_it')} />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Dynamic Main View */}
                        {viewTab === 'dashboard' ? (
                            <div className="flex-1 p-8 overflow-y-auto flex flex-col relative bg-rwv-bg">
                                <header className="flex justify-between items-end mb-6">
                                    <div>
                                        <div className="flex items-center gap-2 mb-1">
                                            <span className="text-rwv-textMuted text-sm font-medium">Trh /</span>
                                            <span className="text-rwv-lime text-sm font-bold uppercase tracking-wider">{currentLabel}</span>
                                        </div>
                                        <h2 className="text-4xl font-bold text-white tracking-tight">{currentLabel} <span className="text-gray-500 font-light">/ USD</span></h2>
                                    </div>
                                    <div className="text-right">
                                        <p className="text-xs text-rwv-textMuted uppercase tracking-widest mb-1">Spotová Cena</p>
                                        <p className="text-4xl font-sans font-semibold text-white">${spotPrice.toFixed(2)}</p>
                                    </div>
                                </header>
                                <ProjectionChart data={chartData} commodityLabel={currentLabel} isSimulating={isSimulating} />
                                <Phase3LockedFeatures />
                            </div>
                        ) : viewTab === 'simulation' ? (
                            <MathSimulationTab />
                        ) : (
                            // Debug/Dev Tab
                            <div className="flex-1 p-10 overflow-y-auto bg-rwv-bg font-sans">
                                <div className="max-w-3xl mx-auto">
                                    <h2 className="text-3xl font-bold text-yellow-400 mb-2 border-b border-yellow-400/20 pb-4">Výstup pro vývojáře (Debug)</h2>
                                    <div className="mb-8 mt-6">
                                        <span className="text-rwv-textMuted uppercase tracking-widest text-xs font-semibold">Aktivní datový tok komodity</span>
                                        <div className="text-2xl text-white mt-1 font-semibold">{currentLabel} / USD</div>
                                    </div>
                                    <div className="bg-rwv-panel p-6 rounded-xl border border-rwv-border shadow-xl">
                                        <h3 className="text-gray-300 text-sm font-bold mb-4 uppercase tracking-wider">Surová matice 27 kroků projekce</h3>
                                        {chartData.length > 0 ? (
                                            <ul className="space-y-2 text-sm">
                                                {chartData.map((d, i) => (
                                                    <li key={i} className="flex justify-between border-b border-rwv-border/50 pb-1 hover:bg-rwv-border/30 px-2 rounded transition">
                                                        <span className="text-gray-500 font-semibold">Krok {i+1} <span className="text-gray-600">({d.day} dní)</span></span>
                                                        <span className="text-rwv-lime font-bold">${d.price.toFixed(2)}</span>
                                                    </li>
                                                ))}
                                            </ul>
                                        ) : (
                                            <span className="text-red-400 font-semibold">Matice je prázdná. Žádná data nebyla vypočítána.</span>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        <DataHealthWidget healthData={healthData} />
                    </div>
                </div>
            );
        }

        // --- SIDEBAR SLIDER COMPONENT ---
        function SidebarSlider({ title, value, onChange }) {
            return (
                <div className="flex flex-col">
                    <div className="flex justify-between items-center mb-2">
                        <label className="text-xs font-semibold text-gray-300">{title}</label>
                        <span className="font-sans font-semibold text-xs text-rwv-olive bg-rwv-olive/10 px-2 py-0.5 rounded border border-rwv-olive/30">
                            {value.toFixed(2)}
                        </span>
                    </div>
                    <input type="range" min="0.00" max="1.00" step="0.01" value={value} onChange={onChange} />
                    <div className="flex justify-between text-[10px] text-rwv-textMuted mt-1.5 font-sans font-medium">
                        <span>0.00</span>
                        <span>1.00</span>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
